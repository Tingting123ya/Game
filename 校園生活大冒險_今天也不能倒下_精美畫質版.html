<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>校園生活大冒險：今天也不能倒下！</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;background:#0a0a10;overflow:hidden;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;align-items:center}
#wrap{position:relative;width:100%;max-width:430px;height:100%;max-height:100dvh;background:#111;box-shadow:0 0 40px #000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#1a1a24}
#ui{position:absolute;inset:0;pointer-events:none;z-index:20}
#ui *{pointer-events:auto}
.hud{position:absolute;top:6px;left:6px;right:48px;display:flex;gap:5px;align-items:flex-start}
.timebox{background:rgba(10,12,18,.9);border:1px solid #3a4558;border-radius:8px;padding:4px 9px;min-width:72px}
.timebox .tm{font-size:17px;font-weight:700;color:#ffe066;letter-spacing:1px;line-height:1.1}
.timebox .lc{font-size:10px;color:#c8b070;margin-top:1px}
.bars{flex:1;background:rgba(10,12,18,.9);border:1px solid #3a4558;border-radius:8px;padding:4px 7px;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.brow{display:flex;align-items:center;gap:3px;font-size:10px;color:#ddd}
.brow .v{min-width:20px;text-align:right;font-weight:600;color:#eee}
.trk{flex:1;height:6px;background:#1a1e28;border:1px solid #445;border-radius:3px;overflow:hidden}
.fil{height:100%;border-radius:2px;transition:width .3s}
.en .fil{background:linear-gradient(90deg,#e8a020,#f0c840)}
.mo .fil{background:linear-gradient(90deg,#28a850,#48d070)}
.wk .fil{background:linear-gradient(90deg,#3078b8,#48a8e0)}
.to .fil{background:linear-gradient(90deg,#7850b8,#a878d8)}
.to.warn .fil{background:linear-gradient(90deg,#c02828,#e04848);animation:bl .7s infinite}
@keyframes bl{50%{opacity:.5}}
.task{position:absolute;top:52px;left:6px;right:48px;background:rgba(16,26,20,.94);border:1.5px solid #c9a040;border-radius:6px;padding:5px 9px;display:flex;align-items:center;gap:7px;min-height:32px}
.task .fg{color:#e04040;font-size:13px}
.task .tt{font-size:12px;color:#f5f0d0;font-weight:600;line-height:1.2}
.task .ts{font-size:10px;color:#98b888}
.task .cd{margin-left:auto;font-size:11px;color:#e0c060}
.side{position:absolute;top:52px;right:6px;display:flex;flex-direction:column;gap:6px}
.sb{width:36px;height:36px;background:rgba(14,16,24,.92);border:1.5px solid #4a5568;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#ddd;position:relative}
.sb .badge{position:absolute;top:-4px;right:-4px;background:#e03030;color:#fff;font-size:9px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.ctrls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;align-items:flex-end}
.dpad{display:grid;grid-template-columns:36px 36px 36px;grid-template-rows:36px 36px 36px;gap:2px}
.dpad button{width:36px;height:36px;background:rgba(30,34,44,.92);border:1.5px solid #5a6578;border-radius:8px;color:#c8d0e0;font-size:14px;font-weight:700}
.dpad button:active{background:#3a4050;transform:scale(.92)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.dpad .mid{grid-column:2;grid-row:2;background:transparent;border:none;pointer-events:none}
.ctx{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d060,#c89020);border:3px solid #fff8e0;box-shadow:0 4px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:22px;color:#3a2800}
.ctx:active{transform:scale(.9)}
.dlg{position:absolute;bottom:90px;left:8px;right:8px;background:rgba(12,16,22,.96);border:1.5px solid #4a5568;border-radius:12px;padding:12px;display:none;z-index:40;max-height:48%;overflow-y:auto}
.dlg.show{display:block}
.dlg .who{font-size:13px;color:#70c0e8;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.dlg .who .av{width:28px;height:28px;border-radius:6px;background:#2a3040;display:flex;align-items:center;justify-content:center;font-size:14px}
.dlg .txt{font-size:14px;color:#f0ece0;line-height:1.45;margin-bottom:8px}
.dlg .opts{display:flex;flex-direction:column;gap:6px}
.dlg .opt{background:rgba(30,40,52,.95);border:1px solid #4a6080;border-radius:8px;padding:8px 10px;font-size:13px;color:#e8e4d8;text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%}
.dlg .opt:active{background:#3a5068}
.dlg .opt .cost{font-size:11px;color:#a0b0c8;white-space:nowrap;margin-left:8px}
.dlg .inner{color:#c8b888;font-style:italic}
.float{position:absolute;font-size:13px;font-weight:700;pointer-events:none;z-index:50;animation:up 1.2s forwards}
@keyframes up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.toast{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:rgba(20,24,32,.95);border:1px solid #5a6a80;border-radius:8px;padding:8px 14px;font-size:13px;color:#f0e8d0;z-index:60;display:none;white-space:nowrap}
.phone{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;z-index:70;align-items:center;justify-content:center}
.phone.show{display:flex}
.ph-frame{width:92%;max-width:360px;height:88%;background:#1a1e28;border-radius:28px;border:3px solid #3a4050;overflow:hidden;display:flex;flex-direction:column}
.ph-island{width:100px;height:22px;background:#0a0a10;border-radius:12px;margin:8px auto 0}
.ph-nav{display:flex;align-items:center;padding:8px 12px;gap:8px;border-bottom:1px solid #2a3040}
.ph-nav .back{font-size:18px;color:#60b0e0;cursor:pointer}
.ph-nav .title{flex:1;text-align:center;font-size:15px;color:#eee;font-weight:600}
.ph-body{flex:1;overflow-y:auto;background:#0e1218;min-height:0}
.ph-input-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#1a2332;border-top:1px solid #2a3548;flex-shrink:0}
.ph-input-bar input{flex:1;background:#0e1520;border:1px solid #3a4560;border-radius:22px;padding:10px 14px;color:#e8eef5;font-size:15px;outline:none}
.ph-input-bar input::placeholder{color:#6a7890}
.ph-input-bar input:focus{border-color:#30a050}
.ph-send-btn{width:40px;height:40px;border-radius:50%;border:none;background:#30a050;color:#fff;font-size:18px;font-weight:700;flex-shrink:0}
.ph-send-btn:active{transform:scale(.92);background:#28a048}
.ph-sticker-btn{width:36px;height:36px;border-radius:50%;border:none;background:#2a3548;font-size:18px;flex-shrink:0}
.ph-sticker-panel{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#151c28;border-top:1px solid #2a3548;justify-content:center}
.ph-sticker-panel button{width:48px;height:48px;font-size:24px;border-radius:12px;border:1px solid #3a4560;background:#1e2838}
.ph-list .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1a2030;cursor:pointer}
.ph-list .item:active{background:#1a2430}
.ph-list .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.ph-list .info{flex:1;min-width:0}
.ph-list .nm{font-size:14px;color:#eee;font-weight:600}
.ph-list .pv{font-size:12px;color:#8890a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-list .tm{font-size:11px;color:#6a7080}
.ph-list .dot{width:8px;height:8px;background:#30c050;border-radius:50%;flex-shrink:0}
.room-msgs{padding:10px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.4}
.bubble.them{background:#fff;color:#222;align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:#92e060;color:#1a2a10;align-self:flex-end;border-bottom-right-radius:4px}
.bubble .tm{font-size:10px;color:#889;margin-top:3px}
.elder-card{background:linear-gradient(160deg,#ffe0f0 0%,#fff5e6 40%,#e8f8e0 100%);border:3px solid #e070a0;border-radius:14px;padding:14px 10px;text-align:center;margin:6px 0;box-shadow:0 4px 0 #d06090;position:relative;overflow:hidden}
.elder-card .sun{font-size:36px;line-height:1.2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.elder-card .msg{font-size:20px;color:#c02060;font-weight:800;margin:8px 0 4px;letter-spacing:2px;text-shadow:0 1px 0 #fff}
.elder-card .sub{font-size:13px;color:#605040;line-height:1.5;font-weight:600}
.elder-card.pink{background:linear-gradient(160deg,#ffd0e8,#fff0f5,#ffe8f0);border-color:#e05090}
.elder-card.gold{background:linear-gradient(160deg,#fff3c0,#ffeaa0,#fff8e0);border-color:#e0a020}
.elder-card.sky{background:linear-gradient(160deg,#d0f0ff,#e8f8ff,#f0fff0);border-color:#40a0d0}
.sticker-bar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:#1a2030;border-top:1px solid #2a3548}
.sticker-bar button{flex-shrink:0;width:52px;height:52px;border-radius:10px;border:2px solid #3a4560;background:#2a3040;font-size:22px;cursor:pointer}
.sticker-bar button:active{transform:scale(.92);border-color:#e0a040}
.room-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;max-height:280px}
.bubble.them .name{font-size:11px;color:#8ab;margin-bottom:2px}
.room-choices{padding:8px;display:flex;flex-direction:column;gap:6px}
.room-choices button{background:#30a050;color:#fff;border:none;border-radius:18px;padding:9px 12px;font-size:13px;text-align:left}
#start{position:absolute;inset:0;background:linear-gradient(180deg,#1a2030,#0e1218);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#start h1{font-size:20px;color:#f0e8c0;text-align:center;margin-bottom:4px}
#start .sub{font-size:12px;color:#8898a8;margin-bottom:16px}
.sel-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.sel-btn{width:56px;height:56px;border-radius:12px;background:#1e2430;border:2px solid #3a4558;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;color:#ccc}
.sel-btn.on{border-color:#e0b040;background:#2a3040;box-shadow:0 0 8px rgba(224,176,64,.4)}
.sel-btn span{font-size:9px;color:#aab}
.outfit-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.outfit-btn{padding:6px 10px;border-radius:8px;background:#1e2430;border:1.5px solid #3a4558;font-size:12px;color:#ccc}
.outfit-btn.on{border-color:#60b0e0;color:#a0d8f0}
#startGo{margin-top:10px;padding:12px 36px;background:linear-gradient(180deg,#e0b040,#c89020);border:none;border-radius:24px;font-size:16px;font-weight:700;color:#2a1a00}
#startGo:active{transform:scale(.95)}
.panel{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;z-index:80;align-items:center;justify-content:center}
.panel.show{display:flex}
.panel-box{width:90%;max-width:340px;max-height:80%;background:#161c28;border:1.5px solid #4a5568;border-radius:14px;padding:14px;overflow-y:auto}
.panel-box h3{font-size:16px;color:#f0e0b0;margin-bottom:10px;text-align:center}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #2a3040;font-size:13px;color:#ddd}
.shop-item button{background:#3a6a40;color:#c8e0c0;border:none;border-radius:6px;padding:4px 10px;font-size:12px}
.eng-word{color:#4ad4ff;text-decoration:underline;cursor:pointer}
.eng-hint{font-size:11px;color:#a0b070;margin-top:4px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="360" height="640"></canvas>
<div id="ui">
  <div class="hud">
    <div class="timebox"><div class="tm" id="hudTime">08:00</div><div class="lc" id="hudLoc">輔導室・剩 9:00</div></div>
    <div class="bars">
      <div class="brow en">⚡ <div class="trk"><div class="fil" id="barEn" style="width:85%"></div></div><span class="v" id="vEn">85</span></div>
      <div class="brow mo">💚 <div class="trk"><div class="fil" id="barMo" style="width:40%"></div></div><span class="v" id="vMo">40</span></div>

  </div>
  <div class="task" id="taskBar"><span class="fg">⚑</span><div><div class="tt" id="taskTitle">個案紀錄</div><div class="ts" id="taskSub">輔導室・電腦</div></div><span class="cd" id="taskCd"></span></div>

  <div class="ctrls">

</div>
<div class="phone" id="phone">
  <div class="ph-frame">
    <div class="ph-island"></div>
    <div class="ph-nav"><span class="back" id="phBack">‹</span><span class="title" id="phTitle">訊息</span><span style="width:24px"></span></div>
    <div class="ph-body" id="phBody"></div>
    <div class="ph-input-bar" id="phInputBar" style="display:none">
      <button type="button" class="ph-sticker-btn" id="phStickerBtn" title="貼圖">😀</button>

</div>
<div id="start">
  <h1>校園生活大冒險<br>今天也不能倒下！</h1>

<script>
const W=360,H=640,WORLD_H=2000;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let status={energy:85,mood:40,work:15,toilet:20,stars:0,coins:50,time:8*60};
let player={x:180,y:280,dir:0,frame:0,walk:0,speed:1.6};
let camY=0,keys={},touch={};
let charId=0,outfit=0,petEmoji='🐰',petFollow=true;
let dialogOpen=false,phoneOpen=false,nearObj=null;
let bag={throat:1,coffee:0,orange:0,water:3};
let affection={chunbo:50,emma:60,mom:80,xiaoyu:0};
let npcs=[],objs=[],zone='counsel';
let xiaoyuState=0;
let scenarioState={late:0,homework:0,stand:0,fight:0};
let xiaoyu={x:180,y:620};
let phoneUnread=1,humming=false;
let actx=null;
function initA(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,type='square',v=0.08){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.stop(actx.currentTime+d)}
function sfx(n){initA();if(n==='step')tone(120+Math.random()*40,0.04,'triangle',0.04);else if(n==='ok'){tone(523,0.08);setTimeout(()=>tone(659,0.1),80)}else if(n==='click')tone(400,0.03,'sine',0.05);else if(n==='clap'){tone(800,0.05);setTimeout(()=>tone(1000,0.08),50);setTimeout(()=>tone(1200,0.1),100)}else if(n==='water')tone(200,0.15,'sine',0.06);else if(n==='flush'){tone(150,0.2,'sawtooth',0.05);setTimeout(()=>tone(80,0.3,'sawtooth',0.04),150)}else if(n==='coffee'){for(let i=0;i<5;i++)setTimeout(()=>tone(100+Math.random()*50,0.04,'sawtooth',0.03),i*40)}}

let vParticles = [];
let vLeaves = [];
let vMotes = [];

function initVisualFX() {
  vLeaves = [];
  for (let i = 0; i < 24; i++) {
    vLeaves.push({
      x: Math.random() * W,
      y: 900 + Math.random() * 850,
      vx: 0.35 + Math.random() * 0.45,
      vy: 0.4 + Math.random() * 0.5,
      sz: 2 + Math.random() * 2.5,
      col: Math.random() > 0.4 ? '#f2a0b4' : '#f0ca65',
      rot: Math.random() * 6.28
    });
  }
  vMotes = [];
  for (let i = 0; i < 22; i++) {
    vMotes.push({
      x: 180 + Math.random() * 160,
      y: 80 + Math.random() * 380,
      vx: (Math.random() - 0.5) * 0.25,
      vy: -0.2 - Math.random() * 0.25,
      sz: 1 + Math.random() * 1.5,
      a: 0.25 + Math.random() * 0.55
    });
  }
}
initVisualFX();

function spawnFootDust(x, y) {
  if (vParticles.length > 35) return;
  vParticles.push({
    x: x + (Math.random() - 0.5) * 8,
    y: y + 26,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -0.15 - Math.random() * 0.15,
    sz: 2.5,
    life: 1.0,
    decay: 0.06,
    col: 'rgba(220, 205, 185, 0.55)'
  });
}

function spawnCoffeeSteam() {
  if (Math.random() < 0.28 && vParticles.length < 50) {
    vParticles.push({
      x: 210 + (Math.random() - 0.5) * 6,
      y: 195,
      vx: (Math.random() - 0.5) * 0.2,
      vy: -0.38 - Math.random() * 0.28,
      sz: 2.2,
      life: 1.0,
      decay: 0.024,
      col: 'rgba(250, 245, 235, 0.4)'
    });
  }
}

function updateVisualFX() {
  spawnCoffeeSteam();
  for (let i = vParticles.length - 1; i >= 0; i--) {
    let p = vParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) vParticles.splice(i, 1);
  }
  vLeaves.forEach(l => {
    l.x += l.vx;
    l.y += l.vy;
    l.rot += 0.04;
    if (l.x > W + 8) l.x = -8;
    if (l.y > 1800) l.y = 900;
  });
  vMotes.forEach(m => {
    m.x += m.vx;
    m.y += m.vy;
    if (m.y < 70) m.y = 440;
    if (m.x < 170) m.x = 345;
    if (m.x > 350) m.x = 180;
  });
}

// 陰影輔助
function drawShadow(x, y, rx, ry) {
  ctx.save();
  ctx.fillStyle = 'rgba(18, 12, 10, 0.32)';
  ctx.beginPath();
  ctx.ellipse(x, y - camY, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// 精緻植栽
function drawPixelPlant(x, y) {
  const py = y - camY;
  // 陰影
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(x+9, py+24, 8, 3.5); ctx.fill();
  // 陶盆
  ctx.fillStyle = '#94482a'; ctx.fillRect(x+3, py+14, 12, 10);
  ctx.fillStyle = '#b65835'; ctx.fillRect(x+2, py+12, 14, 3);
  ctx.fillStyle = '#682e18'; ctx.fillRect(x+4, py+22, 10, 2);
  // 綠葉（深淺層次立體感）
  ctx.fillStyle = '#1c542a'; ctx.fillRect(x+1, py+4, 16, 9);
  ctx.fillStyle = '#2d7c3d'; ctx.fillRect(x+3, py+1, 12, 10);
  ctx.fillStyle = '#48a858'; ctx.fillRect(x+5, py-1, 8, 7);
  ctx.fillStyle = '#7cd888'; ctx.fillRect(x+6, py+1, 4, 3);
}

// 精緻幾何地毯
function drawPixelRug(x, y, w, h) {
  const ry = y - camY;
  ctx.fillStyle = '#2f5a4a'; ctx.fillRect(x, ry, w, h);
  ctx.fillStyle = '#3f705d'; ctx.fillRect(x+3, ry+3, w-6, h-6);
  // 流蘇花邊
  ctx.fillStyle = '#f0deb0';
  for(let fx = x; fx < x+w; fx += 4) {
    ctx.fillRect(fx, ry-1, 2, 2);
    ctx.fillRect(fx, ry+h-1, 2, 2);
  }
  // 圖騰花紋
  ctx.strokeStyle = '#d4b068'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x+6, ry+6, w-12, h-12);
  ctx.strokeRect(x+14, ry+12, w-28, h-24);
  ctx.fillStyle = '#d4b068'; ctx.fillRect(x+w/2-4, ry+h/2-4, 8, 8);
}

// 精緻書架
function drawPixelBookshelf(x, y, w, h) {
  const sy = y - camY;
  ctx.fillStyle = '#482a17'; ctx.fillRect(x, sy, w, h);
  ctx.fillStyle = '#5c371f'; ctx.fillRect(x+2, sy+2, w-4, h-4);
  const shelfH = 17;
  const bookColors = ['#ad3333', '#2b62a6', '#3b8744', '#d99e28', '#8144b0', '#c9596b', '#399994'];
  for(let row = sy+3; row < sy+h-6; row += shelfH) {
    ctx.fillStyle = '#2e190c'; ctx.fillRect(x+2, row+shelfH-3, w-4, 3);
    let bx = x+4;
    let bIdx = Math.floor(row);
    while(bx < x+w-7) {
      let bw = 3 + (bIdx % 3);
      let bh = 10 + (bIdx % 4);
      let col = bookColors[(bIdx + bx) % bookColors.length];
      ctx.fillStyle = col; ctx.fillRect(bx, row+shelfH-3-bh, bw, bh);
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(bx, row+shelfH-3-bh, 1, bh);
      bx += bw + 1;
      bIdx++;
    }
  }
}

// 暖色木地板繪製
function drawWoodFloor(topY, bottomY) {
  const plankH = 14;
  const plankColors = ['#865234', '#935c3b', '#7e4c2e', '#9b6341', '#8c5536'];
  for(let py = topY; py < bottomY; py += plankH) {
    const drawY = py - camY;
    if (drawY < -plankH || drawY > H) continue;
    let rowIndex = Math.floor(py / plankH);
    let col = plankColors[rowIndex % plankColors.length];
    ctx.fillStyle = col;
    ctx.fillRect(0, drawY, W, plankH);
    // 縫隙暗線
    ctx.fillStyle = 'rgba(40, 20, 10, 0.35)';
    ctx.fillRect(0, drawY + plankH - 1, W, 1);
    // 木板接縫與木釘
    let offset = (rowIndex % 3) * 38;
    for(let px = offset; px < W; px += 76) {
      ctx.fillRect(px, drawY, 1, plankH);
      // 釘子
      ctx.fillStyle = 'rgba(30, 15, 8, 0.4)';
      ctx.fillRect(px + 3, drawY + 2, 1, 1);
      ctx.fillRect(px + 72, drawY + plankH - 3, 1, 1);
      ctx.fillStyle = 'rgba(40, 20, 10, 0.35)';
    }
  }
}

  // 木休閒長椅 (x: 200, y: 1050)
  drawShadow(224, 1068, 26, 6);
  ctx.fillStyle = '#4a2f1b'; ctx.fillRect(198, 1045 - camY, 52, 22);
  ctx.fillStyle = '#845735'; ctx.fillRect(200, 1047 - camY, 48, 8); // 椅背
  ctx.fillStyle = '#9b6840'; ctx.fillRect(200, 1057 - camY, 48, 7); // 椅面

  // 金毛犬 (x: 260, y: 1100)
  drawShadow(276, 1118, 16, 6);
  ctx.fillStyle = '#de9a38'; ctx.fillRect(264, 1102 - camY, 24, 14); // 身體
  ctx.fillStyle = '#f0b04c'; ctx.fillRect(280, 1096 - camY, 12, 12); // 頭
  ctx.fillStyle = '#c87e22'; ctx.fillRect(278, 1102 - camY, 5, 8);  // 耳朵
  ctx.fillStyle = '#222'; ctx.fillRect(288, 1100 - camY, 3, 3); // 眼睛與鼻子

  // ================= 4. 操場與教室 (1400 ~ 1800) =================
  ctx.fillStyle = '#3f7c32'; ctx.fillRect(0, 1400 - camY, W, 400);
  // 紅色 PU 跑道
  ctx.fillStyle = '#b83b32'; ctx.fillRect(30, 1440 - camY, 300, 16);
  ctx.fillStyle = '#d4493f'; ctx.fillRect(30, 1442 - camY, 300, 12);
  ctx.fillStyle = '#fff';
  for(let rx = 35; rx < 330; rx += 30) ctx.fillRect(rx, 1447 - camY, 14, 2); // 分道白線

  // 網球/羽球場 (x: 180, y: 1550)
  ctx.fillStyle = '#2b6f52'; ctx.fillRect(135, 1520 - camY, 90, 60);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(140, 1525 - camY, 80, 50);

  // 鋼琴與美術教室 (1700 ~ 1800)
  drawShadow(124, 1775, 24, 7);
  ctx.fillStyle = '#18181c'; ctx.fillRect(100, 1745 - camY, 48, 28);
  ctx.fillStyle = '#fff'; ctx.fillRect(104, 1765 - camY, 40, 6); // 琴鍵
  ctx.fillStyle = '#000';
  for(let k = 107; k < 140; k += 5) ctx.fillRect(k, 1765 - camY, 3, 4);

  // 美術畫架 (x: 260, y: 1720)
  drawShadow(284, 1745, 16, 5);
  ctx.fillStyle = '#8a5c36'; ctx.fillRect(282, 1715 - camY, 4, 30);
  ctx.fillStyle = '#fff8e8'; ctx.fillRect(268, 1718 - camY, 28, 20); // 畫布
  ctx.fillStyle = '#d44238'; ctx.fillRect(272, 1722 - camY, 8, 8);  // 顏料筆觸
  ctx.fillStyle = '#2c78c8'; ctx.fillRect(282, 1726 - camY, 10, 6);

  // ================= 5. 家裡溫馨客廳 (1800 ~ 2000) =================
  drawWoodFloor(1800, 2000);
  ctx.fillStyle = '#4a2f1b'; ctx.fillRect(0, 1800 - camY, W, 10); // 門口地墊

  // ================= 6. 角色、NPC 與小宇繪製 =================
  // NPCs
  npcs.forEach(n => {
    const ny = n.y - camY;
    if (ny > -40 && ny < H + 40) {
      drawShadow(n.x, n.y + 26, 10, 4);
      ctx.fillStyle = n.color; ctx.fillRect(n.x - 9, ny, 18, 26);
      ctx.fillStyle = '#e8c090'; ctx.fillRect(n.x - 7, ny - 12, 14, 14);
      ctx.fillStyle = '#1a1008'; ctx.fillRect(n.x - 8, ny - 14, 16, 5);
      // 名稱標籤
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(n.x - 18, ny - 28, 36, 13);
      ctx.fillStyle = '#ffe080'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.name, n.x, ny - 18);
      ctx.textAlign = 'left';
    }
  });

  // 小宇
  if (xiaoyuState >= 1) {
    const xy = xiaoyu.y - camY;
    drawShadow(xiaoyu.x, xiaoyu.y + 26, 10, 4);
    ctx.fillStyle = '#2a4060'; ctx.fillRect(xiaoyu.x - 9, xy, 18, 26);
    ctx.fillStyle = '#e8c090'; ctx.fillRect(xiaoyu.x - 7, xy - 12, 14, 14);
    ctx.fillStyle = '#1a2030'; ctx.fillRect(xiaoyu.x - 8, xy - 14, 16, 6);
    if (xiaoyuState >= 2) {
      ctx.fillStyle = '#a05030'; ctx.fillRect(xiaoyu.x - 11, xy + 10, 22, 18);
    }
    // 小宇名牌
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(xiaoyu.x - 18, xy - 28, 36, 13);
    ctx.fillStyle = '#70c8ff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('小宇', xiaoyu.x, xy - 18);
    ctx.textAlign = 'left';
  }

  // 玩家腳印粉塵粒子
  vParticles.forEach(p => {
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y - camY, p.sz * p.life, 0, Math.PI * 2);
    ctx.fill();
  });

  // 玩家
  drawShadow(player.x, player.y + 26, 10, 4.5);
  drawChar(player.x, player.y, player.frame, true);

  // 中庭漂浮落葉與花瓣
  vLeaves.forEach(l => {
    const ly = l.y - camY;
    if (ly > -10 && ly < H + 10) {
      ctx.save();
      ctx.translate(l.x, ly);
      ctx.rotate(l.rot);
      ctx.fillStyle = l.col;
      ctx.fillRect(-l.sz/2, -l.sz/2, l.sz, l.sz * 1.5);
      ctx.restore();
    }
  });

  // ================= 7. 光影層（斜射窗光 + 灰塵微粒） =================
  if (player.y < 650) {
    ctx.save();
    // 窗戶斜射進來的溫暖光柱 (God Rays)
    const rayGrad = ctx.createLinearGradient(270, 0 - camY, 150, 420 - camY);
    rayGrad.addColorStop(0, 'rgba(255, 230, 160, 0.28)');
    rayGrad.addColorStop(0.5, 'rgba(255, 215, 130, 0.16)');
    rayGrad.addColorStop(1, 'rgba(255, 200, 110, 0.0)');

    ctx.fillStyle = rayGrad;
    ctx.beginPath();
    ctx.moveTo(260, 15 - camY);
    ctx.lineTo(348, 15 - camY);
    ctx.lineTo(260, 440 - camY);
    ctx.lineTo(130, 440 - camY);
    ctx.closePath();
    ctx.fill();

    // 光柱中的金黃微塵
    vMotes.forEach(m => {
      const my = m.y - camY;
      if (my > 0 && my < H) {
        ctx.fillStyle = `rgba(255, 245, 210, ${m.a})`;
        ctx.beginPath();
        ctx.arc(m.x, my, m.sz, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.restore();
  }

  // ================= 8. 電影感柔和暗角 (Cinematic Vignette) =================
  const vigGrad = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.7);
  vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0.0)');
  vigGrad.addColorStop(1, 'rgba(10, 8, 16, 0.42)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  // 區域指示標籤
  ctx.fillStyle = 'rgba(14, 18, 24, 0.75)';
  ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 1;
  ctx.strokeRect(W/2 - 42, H - 30, 84, 18);
  ctx.fillRect(W/2 - 42, H - 30, 84, 18);
  ctx.fillStyle = '#f0e6c8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText({counsel:'輔導室',corridor:'走廊',yard:'中庭花園',field:'運動操場',home:'溫馨的家'}[zone]||'', W/2, H - 17);
  ctx.textAlign = 'left';
}
function getZone(y){if(y<500)return 'counsel';if(y<900)return 'corridor';if(y<1400)return 'yard';if(y<1800)return 'field';return 'home'}
function update(dt){
  let mx=0,my=0;
  if(keys['ArrowUp']||keys['w']||touch.up)my=-1;
  if(keys['ArrowDown']||keys['s']||touch.down)my=1;
  if(keys['ArrowLeft']||keys['a']||touch.left)mx=-1;
  if(keys['ArrowRight']||keys['d']||touch.right)mx=1;
  if(mx||my){player.x+=mx*player.speed;player.y+=my*player.speed;player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(60,Math.min(WORLD_H-40,player.y));player.walk+=0.15;player.frame=Math.floor(player.walk)%2;if(Math.random()<0.08)sfx('step');spawnFootDust(player.x, player.y);status.toilet=Math.min(100,status.toilet+0.02);status.energy=Math.max(0,status.energy-0.005)}
  camY=player.y-H*0.45;camY=Math.max(0,Math.min(WORLD_H-H,camY));zone=getZone(player.y);status.time+=dt/60000*0.4;
  if(xiaoyuState===0&&status.time>8*60+4){xiaoyuState=1;toast('小宇往輔導室走來了。');setTask('小宇不想回教室','輔導室');phoneUnread=2;updateBadge()}
  if(xiaoyuState===1){xiaoyu.y-=0.9;if(xiaoyu.y<=380){xiaoyu.y=380;xiaoyuState=2;toast('先坐一下。')}}
  nearObj=null;let best=42;
  objs.forEach(o=>{const d=Math.hypot(o.x+o.w/2-player.x,o.y+o.h/2-player.y);if(d<best){best=d;nearObj=o}});
  npcs.forEach(n=>{const d=Math.hypot(n.x-player.x,n.y-player.y);if(d<best){best=d;nearObj={id:'npc_'+n.id,npc:n,icon:'💬',label:n.name}}});
  if(xiaoyuState>=2&&xiaoyuState<4){const d=Math.hypot(xiaoyu.x-player.x,xiaoyu.y-player.y);if(d<55){nearObj={id:'xiaoyu',icon:'💬',label:'小宇'}}}
  document.getElementById('ctxBtn').textContent=nearObj?(nearObj.icon||'💬'):'✋';
  if(status.mood>=80&&!humming&&Math.random()<0.002){humming=true;toast('🎵 ♪ Golden... working all day ♪');setTimeout(()=>humming=false,3000)}
  updateHUD();
}
function updateHUD(){
  const h=Math.floor(status.time/60),m=Math.floor(status.time%60);
  document.getElementById('hudTime').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const remain=Math.max(0,9*60-(status.time-8*60));
  document.getElementById('hudLoc').textContent=({counsel:'輔導室',corridor:'走廊',yard:'中庭',field:'操場',home:'家'}[zone]||'')+'・剩 '+Math.floor(remain/60)+':'+String(Math.floor(remain%60)).padStart(2,'0');
  document.getElementById('barEn').style.width=status.energy+'%';document.getElementById('vEn').textContent=Math.round(status.energy);
  document.getElementById('barMo').style.width=status.mood+'%';document.getElementById('vMo').textContent=Math.round(status.mood);
  document.getElementById('barWk').style.width=status.work+'%';document.getElementById('vWk').textContent=Math.round(status.work);
  document.getElementById('barTo').style.width=status.toilet+'%';document.getElementById('vTo').textContent=Math.round(status.toilet);
  document.getElementById('toRow').className='brow to'+(status.toilet>75?' warn':'');
}

}

function enSpeak(text){
  try{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function sendTypedMessage(){
  var inp=document.getElementById('phInput');
  if(!inp||!currentChat)return;
  var text=(inp.value||'').trim();
  if(!text)return;
  inp.value='';
  // hide sticker panel
  var panel=document.getElementById('phStickerPanel');
  if(panel)panel.style.display='none';

  appendBubble('me', escapeHtml(text));
  status.mood+=1;sfx('ok');updateHUD();

  // auto reply based on chat + keywords
  setTimeout(function(){ autoReplyChat(currentChat, text); }, 600 + Math.random()*400);
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function autoReplyChat(chat, text){
  var lower=text.toLowerCase();
  var reply=null, name=null;

  if(chat==='mom'){
    name=null;
    if(/早|morning|good morning/.test(lower)) reply='早啊～記得吃早餐，天氣涼穿多一點。';
    else if(/愛|love|想你/.test(lower)) reply='媽媽也愛你 ❤️ 晚上早點回來。';
    else if(/晚|遲|加班|輔導/.test(lower)) reply='好，那你注意安全，到家傳訊息給我。';
    else if(/吃|飯|晚餐|lunch|dinner/.test(lower)) reply='想吃什麼告訴媽媽，我準備。';
    else if(/長輩|貼圖|stick/.test(lower)) reply='哈哈好可愛！再傳一張給媽媽看～';
    else if(/謝謝|thanks|thank/.test(lower)) reply='不客氣，有事就跟媽媽說。';
    else reply=['嗯嗯，媽媽知道了。','好，乖乖的。','收到，注意身體喔。','知道了，愛你 💕'][Math.floor(Math.random()*4)];
  }
  else if(chat==='family'){
    if(/早|morning/.test(lower)){ name='媽媽'; reply='早安！今天也要開心喔。'; }
    else if(/弟|玩/.test(lower)){ name='弟弟'; reply='好耶！晚上等你回來一起玩～'; }
    else if(/爸|工作|加油/.test(lower)){ name='爸爸'; reply='收到，你也要加油學習！'; }
    else if(/愛|love/.test(lower)){ name='媽媽'; reply='我們也愛你 ❤️❤️'; }
    else {
      name=['媽媽','爸爸','弟弟'][Math.floor(Math.random()*3)];
      reply=['收到～','好的！','嗯嗯！','知道了 😊'][Math.floor(Math.random()*4)];
    }
  }
  else if(chat==='emma'){
    name=null;
    if(/help|幫|教/.test(lower)) reply='Sure! We can study together after class. 📚';
    else if(/finish|done|寫完|完成/.test(lower)) reply='Great job! See you tomorrow 😊';
    else if(/hi|hello|hey|嗨/.test(lower)) reply='Hey! How are you today?';
    else if(/thank|謝謝/.test(lower)) reply='You\'re welcome!';
    else if(/bye|再見|掰/.test(lower)) reply='Bye~ Take care!';
    else reply=['OK!','Got it 👍','Haha nice','I see!'][Math.floor(Math.random()*4)];
    // speak short english if mostly english
    if(/^[a-zA-Z0-9\s.,!?'"]+$/.test(text) && text.length<40){ try{speak(text)}catch(e){} }
  }
  else if(chat==='friends'){
    if(/球|打球|basket|ball/.test(lower)){ name='小傑'; reply='好！中午球場見 🏀'; }
    else if(/圖書館|library|讀書|複習/.test(lower)){ name='小雨'; reply='我在圖書館等你！'; }
    else if(/小宇|輔導/.test(lower)){ name='阿明'; reply='了解，謝謝你說。'; }
    else {
      name=['小傑','小雨','阿明'][Math.floor(Math.random()*3)];
      reply=['哈哈','好啊','收到～','+1'][Math.floor(Math.random()*4)];
    }
  }
  else {
    return; // scam/broadcast no free chat reply
  }

  if(reply) appendBubble('them', reply, name);
}

        setChoices([
          {t:'回覆：舉手之勞',fn:"friendsMore('舉手之勞，大家互相照顧')"},
          {t:'傳貼圖 ❤️',fn:"sendPlainSticker('friends','❤️')"},
          {t:'回列表',fn:"showPhoneList()"}
        ]);
      },600);
    },500);
  }
  sfx('ok');
}
function friendsMore(txt){
  appendBubble('me',txt);
  status.mood+=2;updateHUD();
  setTimeout(function(){
    appendBubble('them','嗯嗯！','小傑');
    setChoices([{t:'回列表',fn:'showPhoneList()'}]);
  },500);
}

function replyFamily(n){familyText(['早安！今天會準時回家吃飯','謝謝爸的祝福 ❤️','工作順利！'][n-1]||'早安');}
function scamOk(){status.stars+=8;toast('正確！已封鎖檢舉 +8⭐');sfx('clap');showPhoneList()}
function scamBad(){status.mood-=10;toast('⚠️ 這是詐騙！下次先求證');showInner('個資不能隨便填寫。')}
function scamAsk(){status.stars+=5;toast('先問家人是好習慣 +5⭐');sfx('ok')}

document.getElementById('phBack').onclick=()=>{if(document.getElementById('phTitle').textContent==='訊息')closePhone();else showPhoneList()};
function openBag(){document.getElementById('bagPanel').classList.add('show');document.getElementById('bagList').innerHTML=`<div class="shop-item"><span>⭐ 學力星 ${status.stars}</span></div><div class="shop-item"><span>🪙 金幣 ${status.coins}</span></div><div class="shop-item"><span>☕ 手沖咖啡 ×${bag.coffee}</span></div><div class="shop-item"><span>🍊 橘子 ×${bag.orange}</span></div><div class="shop-item"><span>🍬 喉糖 ×${bag.throat}</span></div><div class="shop-item"><span>💧 水壺 ${bag.water}/5</span></div><div class="shop-item"><button onclick="openShop()">去福利小舖</button></div>`}
function openShop(){closePanel('bagPanel');document.getElementById('shopPanel').classList.add('show');document.getElementById('shopList').innerHTML=`<div class="shop-item"><span>☕ 咖啡包 (5⭐)</span><button onclick="buy('coffee',5)">兌換</button></div><div class="shop-item"><span>🍊 橘子 (3⭐)</span><button onclick="buy('orange',3)">兌換</button></div><div class="shop-item"><span>🍬 喉糖 (2⭐)</span><button onclick="buy('throat',2)">兌換</button></div><div class="shop-item"><span>送春伯喉糖</span><button onclick="giftChunbo()">贈送</button></div><div class="shop-item"><span>送 Emma 咖啡</span><button onclick="giftEmma()">贈送</button></div>`}
function buy(item,cost){if(status.stars<cost){toast('星星不足');return}status.stars-=cost;bag[item]=(bag[item]||0)+1;toast('獲得 '+item);sfx('ok');openShop()}
function giftChunbo(){if(bag.throat<1){toast('沒有喉糖');return}bag.throat--;affection.chunbo+=15;toast('春伯好感 +15');sfx('ok')}
function giftEmma(){if(bag.coffee<1){toast('沒有咖啡');return}bag.coffee--;affection.emma+=15;toast('Emma 好感 +15');sfx('ok')}
function closePanel(id){document.getElementById(id).classList.remove('show')}
function openEng(){document.getElementById('engPanel').classList.add('show');
  const words=[{w:'responsibility',ph:'/rɪˌspɒnsəˈbɪləti/',zh:'責任',ex:'I take responsibility for my choices.'},{w:'empathize',ph:'/ˈempəθaɪz/',zh:'同理',ex:'We should empathize with others.'},{w:'deadline',ph:'/ˈdedlaɪn/',zh:'截止日期',ex:'The deadline is tomorrow.'},{w:'discipline',ph:'/ˈdɪsəplɪn/',zh:'自律',ex:'Discipline helps us grow.'},{w:'procrastinate',ph:'/prəˈkræstɪneɪt/',zh:'拖延',ex:'Do not procrastinate on homework.'}];
  let html='<p style="color:#a0b070;font-size:12px;margin-bottom:8px">點單字聽發音 → 影子跟讀 → 確認（念錯可再試）</p>';
  words.forEach((o,i)=>{html+=`<div style="margin:8px 0;padding:8px;background:#1a2030;border-radius:8px"><span class="eng-word" style="font-size:16px" onclick="speak('${o.w}')">${o.w}</span><div class="eng-hint">${o.ph}　${o.zh}</div><div style="font-size:12px;color:#c8d0e0;margin:4px 0">${o.ex}</div><button onclick="speak('${o.ex}');startShadow('${o.w}')" style="margin-top:4px;padding:4px 10px;background:#2a5080;color:#c0d8f0;border:none;border-radius:6px;font-size:12px">跟讀練習</button></div>`});
  html+=`<button onclick="closePanel('engPanel');toast('我懂了，繼續');status.stars+=1" style="width:100%;padding:8px;margin-top:8px;background:#3a6040;color:#c0e0c0;border:none;border-radius:8px">我懂了，繼續（+1⭐）</button>`;
  document.getElementById('engContent').innerHTML=html;
}
function startShadow(word){speak(word,0.75);setTimeout(()=>{showDlg('影子跟讀','請跟著念：'+word,[
  {t:'✅ 我念對了',a:()=>{status.stars+=3;toast('掌聲！+3⭐');sfx('clap');floatNum('+3⭐')}},
  {t:'再聽一次／再試',a:()=>{speak(word,0.7);setTimeout(()=>startShadow(word),800)}},
  {t:'我懂了，繼續',a:()=>{status.stars+=1;toast('+1⭐')}}
])},600)}
function openTodo(){document.getElementById('todoPanel').classList.add('show');document.getElementById('todoList').innerHTML=`<div class="shop-item"><span>${xiaoyuState>=4?'✅':'⬜'} 小宇晤談</span></div><div class="shop-item"><span>⬜ 13:30 個案會議</span></div><div class="shop-item"><span>⬜ 回覆林老師</span></div><div class="shop-item"><span>⬜ 放學家庭常規</span></div><div class="shop-item"><span>⭐ ${status.stars}　🪙 ${status.coins}</span></div>`}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='Enter')tryInteract();if(e.key==='Escape'){closeDlg();closePhone()}});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.dpad button').forEach(btn=>{const d=btn.dataset.d;if(!d)return;const on=e=>{e.preventDefault();touch[d]=1;initA()};const off=e=>{e.preventDefault();touch[d]=0};btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off);btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off)});
document.getElementById('ctxBtn').onclick=tryInteract;
document.getElementById('btnPhone').onclick=()=>{sfx('click');openPhone()};
document.getElementById('btnBag').onclick=()=>{sfx('click');openBag()};
document.getElementById('btnTodo').onclick=()=>{sfx('click');openTodo()};
document.getElementById('btnPause').onclick=()=>{showDlg('暫停','',[
  {t:'繼續遊戲',a:()=>{}},
  {t:'英文練習',a:()=>openEng()},
  {t:'福利小舖',a:()=>openShop()},
  {t:'變裝切換',a:()=>{outfit=(outfit+1)%4;toast(['學生制服','運動服','休閒外套','正式襯衫'][outfit])}}
])};
document.querySelectorAll('#charGrid .sel-btn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#charGrid .sel-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');charId=+b.dataset.c}});
document.querySelectorAll('#outfitRow .outfit-btn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#outfitRow .outfit-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');outfit=+b.dataset.o}});
document.querySelectorAll('#petRow .pet-btn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#petRow .pet-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');petEmoji=b.dataset.p}});
document.getElementById('startGo').onclick=()=>{document.getElementById('start').style.display='none';initA();sfx('ok');
  showInner('走廊上有人在趕作業。輔導室的冷氣又在滴水。',[{t:'繼續',a:()=>{
    showInner('我把今天的行程攤開。上面只寫了一行：13:30 個案會議。',[{t:'開始工作',a:()=>{setTask('個案紀錄','輔導室・電腦');toast('方向鍵移動，金色鈕互動。往下走會到走廊／中庭／操場／家')}}]);
  }}]);
};
initWorld();updateHUD();setTask('個案紀錄','輔導室・電腦');
let last=performance.now();
function loop(now){const dt=now-last;last=now;if(!dialogOpen&&!phoneOpen)update(dt);ctx.clearRect(0,0,W,H);drawWorld();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
