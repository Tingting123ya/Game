<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>校園生活大冒險：今天也不能倒下！</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;background:#0d0d12;overflow:hidden;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;align-items:center}
#wrap{position:relative;width:100%;max-width:430px;height:100%;max-height:100dvh;background:#111;box-shadow:0 0 60px rgba(0,0,0,.9)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#1a1a28}
#ui{position:absolute;inset:0;pointer-events:none;z-index:20}

/* ===== HUD ===== */
.hud-top{position:absolute;top:8px;left:8px;right:52px;display:flex;gap:6px;align-items:flex-start}
.time-cap{background:rgba(12,14,20,.88);border:1px solid #3a4555;border-radius:8px;padding:5px 10px;min-width:78px}
.time-cap .t{font-size:18px;font-weight:700;color:#ffe066;letter-spacing:1px;line-height:1.1}
.time-cap .loc{font-size:11px;color:#c8b87a;margin-top:1px}
.bars{flex:1;background:rgba(12,14,20,.88);border:1px solid #3a4555;border-radius:8px;padding:5px 8px;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.bar-row{display:flex;align-items:center;gap:4px;font-size:11px;color:#ddd}
.bar-row span.v{min-width:22px;text-align:right;color:#eee;font-weight:600}
.track{flex:1;height:7px;background:#1a1e28;border:1px solid #445;border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:2px;transition:width .25s}
.en .fill{background:linear-gradient(90deg,#e8a820,#f0c850)}
.mo .fill{background:linear-gradient(90deg,#28a858,#50d878)}
.wk .fill{background:linear-gradient(90deg,#3080c0,#50b0e8)}
.to .fill{background:linear-gradient(90deg,#8050c0,#b080e0)}
.to.warn .fill{background:linear-gradient(90deg,#c03030,#e05050);animation:blink 0.8s infinite}
@keyframes blink{50%{opacity:.55}}

.task-bar{position:absolute;top:58px;left:8px;right:52px;background:rgba(18,28,22,.92);border:1.5px solid #c9a84c;border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:36px}
.task-bar .flag{color:#e05050;font-size:14px}
.task-bar .tt{font-size:13px;color:#f5f0d8;font-weight:600;line-height:1.25}
.task-bar .ts{font-size:11px;color:#a8c090}

.side-tools{position:absolute;top:58px;right:8px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.side-tools button{width:40px;height:40px;border-radius:10px;border:1px solid #4a5568;background:rgba(20,26,36,.92);color:#e8e0d0;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.side-tools button .badge{position:absolute;top:-4px;right:-4px;background:#e04040;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ===== Controls ===== */
.dpad{position:absolute;bottom:18px;left:12px;width:118px;height:118px;pointer-events:auto}
.dpad button{position:absolute;width:38px;height:38px;background:rgba(36,42,52,.92);border:1.5px solid #5a6578;border-radius:8px;color:#d0d8e0;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.35)}
.dpad button:active{background:rgba(50,60,75,.95);transform:scale(.94)}
.dpad .u{top:0;left:40px}.dpad .d{bottom:0;left:40px}.dpad .l{top:40px;left:0}.dpad .r{top:40px;right:0}

.ctx-btn{position:absolute;bottom:22px;right:14px;width:62px;height:62px;border-radius:50%;border:3px solid #e8c860;background:radial-gradient(circle at 35% 30%,#3a4558,#1a2030);color:#f5e8c0;font-size:26px;display:none;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);z-index:25}
.ctx-btn.show{display:flex}

/* ===== Dialog ===== */
.dialog{position:absolute;bottom:100px;left:10px;right:10px;background:rgba(16,22,30,.96);border:1.5px solid #4a6a5a;border-radius:12px;padding:12px 14px;display:none;pointer-events:auto;max-height:42%;overflow-y:auto;z-index:30}
.dialog .who{font-size:14px;color:#7ec8ff;font-weight:700;margin-bottom:4px}
.dialog .who small{color:#8a9aaa;font-weight:500;margin-left:6px}
.dialog .txt{font-size:15px;color:#f0ebe0;line-height:1.55;margin-bottom:8px}
.dialog .opts{display:flex;flex-direction:column;gap:6px}
.dialog .opts button{background:#2a3848;border:1px solid #4a6a7a;color:#f5f0e0;padding:10px 12px;border-radius:8px;font-size:14px;text-align:left;line-height:1.35}
.dialog .opts button:active{background:#3a5060}
.dialog .opts .cost{float:right;color:#a0b0c0;font-size:12px}

.inner{position:absolute;bottom:155px;left:16px;right:16px;background:rgba(28,22,40,.94);border:1px solid #6a5a8a;border-radius:8px;padding:10px 14px;color:#e0d0f0;font-size:14px;font-style:italic;display:none;text-align:center;z-index:28;line-height:1.45}
.toast{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffe080;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;white-space:nowrap;max-width:90%;text-align:center}
.reward-pop{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:rgba(20,40,30,.95);border:1px solid #5a9a6a;color:#c0f0c0;padding:6px 14px;border-radius:6px;font-size:13px;display:none;z-index:90}

/* ===== Phone ===== */
.phone-mask{position:absolute;inset:0;background:rgba(0,0,0,.78);display:none;z-index:60;pointer-events:auto;align-items:center;justify-content:center;padding:12px}
.phone-mask.show{display:flex}
.phone{width:100%;max-width:340px;height:min(620px,88dvh);background:#1c1c1e;border-radius:36px;border:3px solid #3a3a3e;box-shadow:0 0 0 2px #222,0 20px 50px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone-notch{height:28px;display:flex;align-items:center;justify-content:center;background:#000;flex-shrink:0}
.phone-notch .island{width:100px;height:22px;background:#0a0a0a;border-radius:12px}
.phone-status{height:22px;background:#f7f7f7;display:flex;justify-content:space-between;padding:0 16px;font-size:11px;color:#111;align-items:center;flex-shrink:0}
.phone-nav{height:44px;background:#f7f7f7;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.phone-nav .title{flex:1;text-align:center;font-size:17px;font-weight:700;color:#111}
.phone-nav .back{font-size:22px;color:#07c160;width:36px;cursor:pointer}
.phone-nav .pod{background:#07c160;color:#fff;border:none;border-radius:14px;padding:4px 10px;font-size:12px}
.phone-body{flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch}
.chat-row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #f0f0f0;align-items:center;cursor:pointer}
.chat-row:active{background:#f5f5f5}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.chat-meta{flex:1;min-width:0}
.chat-meta .n{font-size:15px;color:#111;font-weight:600}
.chat-meta .p{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-meta .tm{font-size:11px;color:#aaa;float:right}
.unread{background:#07c160;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:4px}

/* chat room */
.room{display:none;flex-direction:column;height:100%;background:#7294a6}
.room.show{display:flex}
.room-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.45;position:relative}
.bubble.them{background:#fff;color:#111;align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:#95ec69;color:#111;align-self:flex-end;border-bottom-right-radius:4px}
.bubble .tm{font-size:10px;color:#888;margin-top:3px}
.elder-card{width:200px;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.elder-card .ec-bg{background:linear-gradient(160deg,#ff9a5c 0%,#ff6b9d 40%,#7b5cff 100%);padding:14px 12px 10px;text-align:center}
.elder-card .ec-title{font-size:32px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #c04020,0 0 12px rgba(255,200,50,.6);letter-spacing:4px}
.elder-card .ec-sub{font-size:16px;font-weight:700;color:#fff8c0;margin-top:2px;text-shadow:1px 1px 0 #8040a0}
.elder-card .ec-wish{margin-top:8px;background:rgba(180,40,60,.85);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;display:inline-block}
.elder-card .ec-art{height:48px;position:relative;margin-top:6px}
.elder-card .sun{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:28px;height:28px;background:#ffd040;border-radius:50%;box-shadow:0 0 12px #ffc020}
.elder-card .lotus{position:absolute;bottom:0;width:18px;height:12px;background:#40c080;border-radius:50% 50% 0 0}
.room-input{background:#f0f0f0;padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.room-input .choices{display:flex;flex-direction:column;gap:5px}
.room-input .choices button{background:#07c160;color:#fff;border:none;border-radius:18px;padding:9px 14px;font-size:14px;text-align:left}

/* ===== Overlays ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;z-index:70;pointer-events:auto;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.panel{background:#1a2230;border:1.5px solid #4a6a8a;border-radius:14px;padding:16px;width:100%;max-width:360px;max-height:85dvh;overflow-y:auto;color:#f0ebe0}
.panel h2{font-size:18px;color:#7ec8ff;margin-bottom:10px;text-align:center}
.panel h3{font-size:15px;color:#c0d0e0;margin:12px 0 6px}
.panel .close-x{float:right;font-size:22px;color:#889;cursor:pointer;line-height:1}
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word-card{background:#243040;border:1px solid #3a5060;border-radius:10px;padding:10px;cursor:pointer}
.word-card .en{font-size:16px;color:#4ad4ff;font-weight:700}
.word-card .zh{font-size:13px;color:#ffd060;margin-top:2px}
.word-card .ph{font-size:12px;color:#90a0b0}
.big-btn{display:block;width:100%;padding:12px;margin-top:8px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.big-btn.green{background:#28a858;color:#fff}
.big-btn.blue{background:#3070c0;color:#fff}
.big-btn.gold{background:#c09020;color:#fff}
.big-btn.gray{background:#3a4555;color:#ddd}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#243040;border-radius:8px;margin-bottom:6px;border:1px solid #3a5060}
.shop-item .info .nm{font-size:15px;color:#f0e8d0}
.shop-item .info .ds{font-size:12px;color:#90a0b0}
.shop-item button{background:#c09020;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px}

/* start screen */
#start{position:absolute;inset:0;background:rgba(10,14,22,.96);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;pointer-events:auto;overflow-y:auto}
#start h1{font-size:22px;color:#f5e8c0;text-align:center;margin-bottom:6px;line-height:1.35}
#start .sub{font-size:13px;color:#a0b0c0;text-align:center;margin-bottom:16px;line-height:1.5}
.sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px;margin-bottom:12px}
.sel-btn{background:#243040;border:2px solid #3a5060;border-radius:10px;padding:10px 8px;color:#e0d8c8;font-size:13px;text-align:center;cursor:pointer}
.sel-btn.on{border-color:#e8c050;background:#3a3020}
.sel-btn .t{font-weight:700;font-size:14px;display:block}
.pet-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.pet-btn{width:42px;height:42px;border-radius:10px;border:2px solid #3a5060;background:#243040;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pet-btn.on{border-color:#e8c050;background:#3a3020}
.start-go{margin-top:12px;background:#e8c050;color:#1a1408;border:none;border-radius:12px;padding:14px 36px;font-size:17px;font-weight:800;cursor:pointer}

.eng-word{color:#3ab0ff;text-decoration:underline;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<div id="ui">
  <div class="hud-top">
    <div class="time-cap"><div class="t" id="timeT">08:00</div><div class="loc" id="locT">輔導室・剩 9:00</div></div>

  </div>
  <div class="task-bar" id="taskBar"><span class="flag">🚩</span><div><div class="tt" id="taskT">個案紀錄</div><div class="ts" id="taskS">輔導室・電腦</div></div></div>
  <div class="side-tools">
    <button id="btnTodo" title="待辦">📋</button>

<!-- English / Shop / Bag overlays -->

<!-- Start -->
<div id="start">
  <h1>校園生活大冒險<br>今天也不能倒下！</h1>

<script>
// ============================================================
// 校園生活大冒險：今天也不能倒下！ Master Edition
// ============================================================
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const VW=360,VH=640,TILE=16;
const WORLD_W=360,WORLD_H=2400;

// Zones: 0-500 counseling, 500-900 corridor, 900-1400 courtyard, 1400-1800 playground, 1800-2400 home
let camY=0;
const player={x:180,y:200,w:16,h:26,spd:1.7,dir:0,frame:0,ft:0,moving:false};
const status={energy:85,mood:70,work:20,toilet:25,stars:15,coins:60,time:8*60,safety:70};
let charId=0,petEmoji='🐰',petName='兔子';
let dialogOpen=false,phoneOpen=false,currentInteract=null;
const keys={},touch={u:0,d:0,l:0,r:0};
let bag={throat:2,orange:1,coffee:1,flower:0,cookie:0};
let bonds={chen:0,xiaoyu:0,emma:0,lin:0,family:1};
let phoneUnread=2;
let task={title:'個案紀錄',sub:'輔導室・電腦',done:false};
let audioCtx=null;

// ----- Audio -----
function initA(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,t='square',v=0.07){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function sfx(name){initA();
  if(name==='step')tone(120+Math.random()*40,0.04,'triangle',0.03);
  if(name==='click')tone(700,0.04,'square',0.05);
  if(name==='ok'){tone(523,0.1);setTimeout(()=>tone(659,0.1),90);setTimeout(()=>tone(784,0.15),180)}
  if(name==='water'){tone(400,0.08,'sine',0.05);setTimeout(()=>tone(300,0.12,'sine',0.04),50)}
  if(name==='coffee'){for(let i=0;i<5;i++)setTimeout(()=>tone(160+Math.random()*60,0.04,'sawtooth',0.03),i*35)}
  if(name==='flush'){tone(100,0.35,'sawtooth',0.06);setTimeout(()=>tone(60,0.4,'triangle',0.04),250)}
  if(name==='clap'){tone(800,0.06,'square',0.06);setTimeout(()=>tone(600,0.08,'square',0.05),70);setTimeout(()=>tone(900,0.1,'square',0.05),140)}
  if(name==='hum')tone(392,0.15,'sine',0.04);
}

// ----- Speech -----
function speak(text,rate=0.85){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=rate;u.pitch=1;
  window.speechSynthesis.speak(u);
}
function speakZh(text){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';u.rate=0.95;
  window.speechSynthesis.speak(u);
}

// ----- Vocab -----

// ----- Drawing helpers -----
function pr(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)}
function drawChar(px,py,dir,frame,c,isPlayer){
  const ox=Math.floor(px),oy=Math.floor(py);
  pr(ox+4,oy,8,8,c.skin);
  pr(ox+3,oy,10,3,c.hair);pr(ox+3,oy+3,2,3,c.hair);pr(ox+11,oy+3,2,3,c.hair);
  pr(ox+5,oy+4,2,2,'#222');pr(ox+9,oy+4,2,2,'#222');
  pr(ox+3,oy+9,10,9,c.shirt);pr(ox+6,oy+9,4,2,'#fff');
  if(c.bag){pr(ox+2,oy+10,2,6,'#5a3a1a');pr(ox+12,oy+10,2,6,'#5a3a1a');pr(ox+1,oy+15,3,4,'#6a4a2a')}
  const leg=frame%2&&isPlayer&&player.moving?1:0;
  pr(ox+4,oy+18,3,7-leg,c.pants);pr(ox+9,oy+18+leg,3,7-leg,c.pants);
  pr(ox+3,oy+24,4,2,'#333');pr(ox+9,oy+24,4,2,'#333');
}
function drawPlant(x,y){pr(x+6,y+16,8,10,'#6a4a2a');pr(x+2,y+4,6,12,'#2a8a2a');pr(x+8,y,8,14,'#3a9a3a')}
function drawTree(x,y){pr(x+10,y+30,8,24,'#5a3a1a');pr(x,y,28,20,'#2a7a2a');pr(x+4,y-8,20,16,'#3a8a3a')}

function getZone(y){
  if(y<500)return 'counseling';
  if(y<900)return 'corridor';
  if(y<1400)return 'courtyard';
  if(y<1800)return 'playground';
  return 'home';
}
function zoneName(z){return{counseling:'輔導室',corridor:'走廊',courtyard:'中庭',playground:'操場',home:'家裡'}[z]||'校園'}

function drawFloor(wx,wy,zone){
  const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);
  if(zone==='counseling'){
    pr(wx,wy,TILE,TILE,(tx+ty)%2?'#8b5e3c':'#a06e4a');
    if(ty%2===0)pr(wx,wy+7,TILE,1,'#7a4e2c');
  }else if(zone==='corridor'){
    pr(wx,wy,TILE,TILE,'#c8d4b8');
    if((tx*7+ty*13)%5===0)pr(wx+4,wy+6,2,2,'#a0b090');
  }else if(zone==='courtyard'){
    pr(wx,wy,TILE,TILE,'#5a9a3a');
    if((tx+ty)%3===0)pr(wx+6,wy+8,3,2,'#4a8a2a');
  }else if(zone==='playground'){
    pr(wx,wy,TILE,TILE,'#6a8a4a');
    if(ty%5===0)pr(wx,wy,TILE,2,'#c04040');
  }else{
    pr(wx,wy,TILE,TILE,'#e8dcc8');
    if((tx+ty)%4===0)pr(wx+2,wy+2,2,2,'#d0c4b0');
  }
}

// ----- Render -----
function render(){
  ctx.fillStyle='#1a1a28';ctx.fillRect(0,0,VW,VH);
  const startY=Math.floor(camY/TILE)*TILE-TILE;
  const endY=camY+VH+TILE;
  for(let wy=Math.max(0,startY);wy<Math.min(WORLD_H,endY);wy+=TILE){
    const zone=getZone(wy);
    for(let wx=0;wx<WORLD_W;wx+=TILE)drawFloor(wx,wy-camY,zone);
  }
  ctx.save();ctx.translate(0,-camY);
  if(player.y<550)drawCounseling();
  if(player.y>450&&player.y<950)drawCorridor();
  if(player.y>850&&player.y<1450)drawCourtyard();
  if(player.y>1350&&player.y<1850)drawPlayground();
  if(player.y>1750)drawHome();

  // golden path dots toward task
  if(!task.done&&player.y<400){
    for(let i=0;i<5;i++){
      const yy=200+i*25;
      pr(175+Math.sin(Date.now()/400+i)*3,yy,6,6,i%2?'#e8c040':'#c0a020');
    }
  }

  for(const o of objects){
    const dist=Math.hypot(player.x-(o.x+o.w/2),player.y-(o.y+o.h/2));
    if(dist<55){
      // pixel !
      pr(o.x+o.w/2-3,o.y-16,6,10,'#ffcc00');
      pr(o.x+o.w/2-3,o.y-4,6,3,'#ffcc00');
    }
  }
  for(const n of npcs){
    drawChar(n.x-8,n.y-26,n.dir,0,n.colors,false);
    if(Math.hypot(player.x-n.x,player.y-n.y)<55){
      ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(n.x-22,n.y-42,44,13);
      ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(n.name,n.x,n.y-32);
    }
  }
  const pc={skin:'#f0c8a0',hair:'#2a1a0a',shirt:charId===3?'#e080a0':charId===2?'#6090c0':'#d0a040',pants:'#4060a0',bag:true};
  drawChar(player.x-8,player.y-26,player.dir,player.frame,pc,true);

  // pet follow
  if(petEmoji){
    ctx.font='16px serif';ctx.textAlign='center';
    ctx.fillText(petEmoji,player.x-18,player.y-8);
  }
  // mood notes
  if(status.mood>=80&&player.moving&&Math.random()<0.015){
    ctx.fillStyle='#ff80ff';ctx.font='14px serif';ctx.fillText('♪',player.x+12,player.y-32);
  }
  ctx.restore();
}

// ----- Update -----
function update(dt){
  let dx=0,dy=0;
  if(keys['ArrowUp']||keys['w']||touch.u){dy=-1;player.dir=3}
  if(keys['ArrowDown']||keys['s']||touch.d){dy=1;player.dir=0}
  if(keys['ArrowLeft']||keys['a']||touch.l){dx=-1;player.dir=1}
  if(keys['ArrowRight']||keys['d']||touch.r){dx=1;player.dir=2}
  player.moving=dx||dy;
  if(player.moving&&!dialogOpen&&!phoneOpen){
    if(dx&&dy){dx*=0.707;dy*=0.707}
    player.x=Math.max(20,Math.min(WORLD_W-20,player.x+dx*player.spd));
    player.y=Math.max(50,Math.min(WORLD_H-30,player.y+dy*player.spd));
    player.ft+=dt;if(player.ft>140){player.frame^=1;player.ft=0;if(Math.random()<0.4)sfx('step')}
    status.energy=Math.max(0,status.energy-0.0025);
    status.toilet=Math.min(100,status.toilet+0.0035);
  }
  const target=player.y-VH*0.42;
  camY+=(target-camY)*0.12;
  camY=Math.max(0,Math.min(WORLD_H-VH,camY));

  const z=getZone(player.y);
  const hh=Math.floor(status.time/60)%24,mm=status.time%60;
  document.getElementById('timeT').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  document.getElementById('locT').textContent=`${zoneName(z)}・剩 ${Math.max(0,17*60-status.time)}分`;
  if(Math.random()<0.008)status.time+=1;

  currentInteract=null;let nearest=999;
  for(const o of objects){
    const d=Math.hypot(player.x-(o.x+o.w/2),player.y-(o.y+o.h/2));
    if(d<45&&d<nearest){nearest=d;currentInteract={type:'obj',o}}
  }
  for(const n of npcs){
    const d=Math.hypot(player.x-n.x,player.y-n.y);
    if(d<42&&d<nearest){nearest=d;currentInteract={type:'npc',n}}
  }
  const ctxBtn=document.getElementById('ctxBtn');
  if(currentInteract&&!dialogOpen){
    ctxBtn.classList.add('show');
    ctxBtn.textContent=currentInteract.type==='npc'?'💬':(currentInteract.o.icon||'✋');
  }else ctxBtn.classList.remove('show');
  updateHUD();
}

  document.getElementById('moF').style.width=status.mood+'%';document.getElementById('moV').textContent=Math.floor(status.mood);
  document.getElementById('wkF').style.width=status.work+'%';document.getElementById('wkV').textContent=Math.floor(status.work);
  document.getElementById('toF').style.width=status.toilet+'%';document.getElementById('toV').textContent=Math.floor(status.toilet);

window.startShadow=function(word){
  const box=document.getElementById('shadowResult');
  box.innerHTML='<p style="color:#ffe080">先聽一次，再跟讀……</p>';
  speak(word,0.7);
  setTimeout(()=>{
    box.innerHTML=`<p style="color:#a0e0ff;font-size:16px">請念出：<b style="color:#4ad4ff;font-size:20px">${word}</b></p>
      <button class="big-btn green" onclick="checkShadow('${word}',true)">我念完了（自我確認）</button>
      <button class="big-btn blue" id="micBtn" onclick="listenShadow('${word}')">🎙️ 開始錄音辨識</button>
      <button class="big-btn gray" onclick="speak('${word}',0.7)">再聽一次</button>`;
  },1200);
};
window.listenShadow=function(word){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const box=document.getElementById('shadowResult');
  if(!SR){box.innerHTML+='<p style="color:#ff8080;margin-top:8px">此裝置不支援語音辨識，請用自我確認</p>';return}
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;
  box.innerHTML='<p style="color:#ffe080">🎙️ 聆聽中，請清楚念出來…</p>';
  rec.onresult=(e)=>{
    const said=e.results[0][0].transcript.toLowerCase().replace(/[^a-z]/g,'');
    const target=word.toLowerCase();
    if(said.includes(target)||target.includes(said)||levenshtein(said,target)<=2){
      checkShadow(word,true);
    }else{
      box.innerHTML=`<p style="color:#ff9080">聽到：${said||'(無)'}　目標：${word}</p>
        <p style="color:#ffd060">沒關係！再聽一次，再試一次。</p>
        <button class="big-btn blue" onclick="speak('${word}',0.7)">再聽一次</button>
        <button class="big-btn green" onclick="listenShadow('${word}')">再跟讀一次</button>
        <button class="big-btn gray" onclick="checkShadow('${word}',false)">我已努力念過（保底）</button>`;
    }
  };
  rec.onerror=()=>{box.innerHTML=`<p style="color:#ff9080">辨識失敗，可改用自我確認</p>
    <button class="big-btn green" onclick="checkShadow('${word}',true)">我念完了</button>
    <button class="big-btn blue" onclick="listenShadow('${word}')">再試錄音</button>`};
  rec.start();
};
function levenshtein(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
  return m[b.length][a.length]}
window.checkShadow=function(word,perfect){
  const box=document.getElementById('shadowResult');
  const add=perfect?5:2;
  status.stars+=add;status.mood=Math.min(100,status.mood+(perfect?4:1));

    <p style="color:#a0b0c0;font-size:13px;margin-top:8px">寵物：${petEmoji} ${petName}</p>
    <button class="big-btn gray" style="margin-top:12px" onclick="document.getElementById('bagOverlay').classList.remove('show')">關閉</button>`;
}
function openTodo(){
  document.getElementById('todoOverlay').classList.add('show');
  document.getElementById('todoPanel').innerHTML=`<span class="close-x" onclick="document.getElementById('todoOverlay').classList.remove('show')">✕</span>
    <h2>今日待辦</h2>
    <p>🚩 ${task.title}<br><small style="color:#a0b0c0">${task.sub}</small></p>
    <p style="margin-top:10px">☐ 輔導室個案／傾聽小宇</p>
    <p>☐ 英文影子跟讀至少 3 個單字</p>
    <p>☐ 防詐簡訊正確處理</p>
    <p>☐ 放學回家：脫鞋→洗碗→作業→叫爸爸</p>
    <p>☐ 送禮物給至少一位 NPC</p>
    <button class="big-btn gray" style="margin-top:12px" onclick="document.getElementById('todoOverlay').classList.remove('show')">關閉</button>`;
}
function openJukebox(){
  closePhone();
  showDlg('心情點歌台','心情高漲時會自動哼唱。也可點播：',[
    {t:'Golden 風格短句',a:()=>{speak('I am golden under the lights');status.mood=Math.min(100,status.mood+3);updateHUD()}},
    {t:'Work 熱血短句',a:()=>{speak('Work work work every day');status.mood=Math.min(100,status.mood+3);updateHUD()}},
    {t:'打開音樂播放清單',a:()=>window.open('https://youtube.com/playlist?list=PLB1PuqtbwVQnYd1AOnvVARNmJGgV5K4_-','_blank')}
  ]);
}

// ----- Mini games (simple) -----
function miniCatch(){
  showDlg('接高飛球','遠方打出高飛球！判斷落點…',[
    {t:'往左跑接球',a:()=>{if(Math.random()>0.4){status.stars+=5;toast('Catch! +5⭐');sfx('ok')}else{toast('Almost! Keep practicing.');speak('Nice try!')};updateHUD()}},
    {t:'往右跑接球',a:()=>{if(Math.random()>0.4){status.stars+=5;toast('Catch! +5⭐');sfx('ok')}else{toast('So close!');speak('You can do it')};updateHUD()}},
    {t:'原地準備',a:()=>{status.stars+=2;toast('安全接住 +2⭐');sfx('ok');updateHUD()}}
  ]);
}
function miniPiano(){
  const notes=['C','D','E','F','G','A','B'];
  const ans=notes[Math.floor(Math.random()*notes.length)];
  const freqs={C:261,D:293,E:329,F:349,G:392,A:440,B:493};
  showDlg('絕對音感','聽音後選擇正確音名',[
    {t:'播放神秘音符',a:()=>{
      initA();tone(freqs[ans],0.5,'sine',0.1);
      setTimeout(()=>{
        showDlg('絕對音感','你聽到的是哪個音？',notes.map(n=>({
          t:n,
          a:()=>{
            if(n===ans){status.stars+=5;toast('Correct! +5⭐');sfx('clap')}
            else{toast('答案是 '+ans+'，再試一次！');sfx('click')}
            updateHUD();
          }
        })));
      },400);
    }}
  ]);
}
function miniArt(){
  showDlg('海報配色','Choose a calm color for a counseling poster:',[
    {t:'Soft blue + green',a:()=>{status.stars+=4;status.mood+=3;toast('配色溫暖！+4⭐');sfx('ok');updateHUD()}},
    {t:'Neon red + black',a:()=>{toast('太刺激了，個案可能不安');status.mood-=2;updateHUD()}},
    {t:'Warm beige + cream',a:()=>{status.stars+=5;toast('很適合輔導室！+5⭐');sfx('ok');updateHUD()}}
  ]);
}
function miniMath(){
  showDlg('邏輯數列','What is next: 2, 4, 8, 16, ?',[
    {t:'18',a:()=>{toast('再想一次：每次乘以 2');speak('Try again')}},
    {t:'32',a:()=>{status.stars+=5;toast('Correct! +5⭐');sfx('ok');updateHUD()}},
    {t:'24',a:()=>{toast('Not quite');speak('Listen carefully')}}
  ]);
}

// ----- Input -----
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='Enter')tryInteract();if(e.key==='Escape'){closeDlg();closePhone()}});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.dpad button').forEach(btn=>{
  const d=btn.dataset.d;
  const on=e=>{e.preventDefault();touch[d]=1;initA()};
  const off=e=>{e.preventDefault();touch[d]=0};
  btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off);
  btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);
});
document.getElementById('ctxBtn').onclick=tryInteract;
document.getElementById('btnPhone').onclick=()=>{sfx('click');openPhone()};
document.getElementById('btnBag').onclick=()=>{sfx('click');openBag()};
document.getElementById('btnTodo').onclick=()=>{sfx('click');openTodo()};
document.getElementById('btnPause').onclick=()=>{showDlg('暫停','',[
  {t:'繼續遊戲',a:()=>{}},
  {t:'開啟英文練習',a:()=>openEng()},
  {t:'福利小舖',a:()=>openShop()}
])};

// ----- Start screen -----
document.querySelectorAll('#charGrid .sel-btn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('#charGrid .sel-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');charId=+b.dataset.c};
});
document.querySelectorAll('#petRow .pet-btn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('#petRow .pet-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');petEmoji=b.dataset.p;
    petName={ '🐰':'兔子','🐱':'貓咪','🐶':'狗狗','🦔':'刺蝟','🐹':'倉鼠','🐊':'鱷魚','🐟':'觀賞魚','🦖':'小恐龍'}[petEmoji]};
});
document.getElementById('startGo').onclick=()=>{
  document.getElementById('start').style.display='none';
  initA();sfx('ok');
  showInner('新的一天開始了，今天也不能倒下！');
  setTimeout(()=>showDlg('【我的內心】','走廊上有人在趕作業。輔導室的冷氣又在滴水。我把今天的行程攤開。上面只寫了一行：13:30 個案會議。',[{t:'開始工作',a:()=>{}}]),800);
};

// ----- Loop -----
initWorld();updateHUD();updateTask();
let last=performance.now();
function loop(now){const dt=now-last;last=now;if(!dialogOpen&&!phoneOpen)update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
