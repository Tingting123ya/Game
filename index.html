<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>校園生活大冒險：獨立房間與精緻美學旗艦版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;background:#060403;overflow:hidden;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;align-items:center}
#wrap{position:relative;width:100%;max-width:430px;height:100%;max-height:100dvh;background:#0d0907;box-shadow:0 0 60px rgba(0,0,0,0.95);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#18100a}

/* ===== HUD ===== */
#ui{position:absolute;inset:0;pointer-events:none;z-index:20}
.hud{position:absolute;top:6px;left:6px;right:48px;display:flex;gap:5px;align-items:flex-start;pointer-events:auto}
.timebox{background:rgba(22,14,10,.95);border:1.5px solid #845e3c;border-radius:10px;padding:4px 8px;min-width:76px;box-shadow:0 3px 10px rgba(0,0,0,.6);cursor:pointer}
.timebox .day-tag{font-size:10px;color:#f39c12;font-weight:800;margin-bottom:1px}
.timebox .tm{font-size:16px;font-weight:800;color:#ffd152;letter-spacing:1px;line-height:1.1}
.timebox .lc{font-size:10px;color:#d8b888;margin-top:1px}
.bars{flex:1;background:rgba(22,14,10,.95);border:1.5px solid #845e3c;border-radius:10px;padding:4px 7px;display:grid;grid-template-columns:1fr 1fr;gap:2px 7px;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.brow{display:flex;align-items:center;gap:3px;font-size:10px;color:#eee}
.brow .v{min-width:18px;text-align:right;font-weight:700;color:#f0f0f0}
.trk{flex:1;height:6px;background:#140e0c;border:1px solid #4a3424;border-radius:3px;overflow:hidden}
.fil{height:100%;border-radius:2px;transition:width .25s}
.en .fil{background:linear-gradient(90deg,#f09819,#edde5d)}
.mo .fil{background:linear-gradient(90deg,#11998e,#38ef7d)}
.wk .fil{background:linear-gradient(90deg,#2193b0,#6dd5ed)}
.to .fil{background:linear-gradient(90deg,#8e2de2,#4a00e0)}

.task{position:absolute;top:52px;left:6px;right:48px;background:rgba(26,16,10,.96);border:1.5px solid #b8860b;border-radius:10px;padding:5px 9px;display:flex;flex-direction:column;gap:3px;pointer-events:auto;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.task-row{display:flex;align-items:center;gap:6px}
.task .fg{color:#e84118;font-size:13px}
.task .tt{font-size:12px;color:#fff2d6;font-weight:800;line-height:1.2}
.task .ts{font-size:10px;color:#a8c49e}
.task .task-pct{margin-left:auto;font-size:11px;font-weight:900;color:#ffd152}
.runner-track{position:relative;width:100%;height:7px;background:#140e0c;border:1px solid #5a3c26;border-radius:4px;margin-top:2px}
.runner-fill{height:100%;background:linear-gradient(90deg,#e67e22,#f1c40f);border-radius:3px;transition:width 0.4s ease}
.runner-person{position:absolute;top:-8px;font-size:13px;transform:translateX(-50%);transition:left 0.4s ease}
.runner-flag{position:absolute;right:-4px;top:-7px;font-size:12px}

.side{position:absolute;top:54px;right:6px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.sb{width:36px;height:36px;background:rgba(30,20,14,.95);border:1.5px solid #845e3c;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#f5eedc;box-shadow:0 3px 8px rgba(0,0,0,.5);cursor:pointer}
.sb:active{transform:scale(.92);background:#4a3220}

/* 頂部切換房間快捷條 */
.quick-tools{position:absolute;top:98px;left:6px;right:6px;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;pointer-events:auto}
.quick-btn{flex-shrink:0;padding:4px 9px;border-radius:14px;border:1.5px solid #555;font-size:11px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap}
.qb-room1{background:linear-gradient(135deg,#e67e22,#d35400);border-color:#f39c12}
.qb-room2{background:linear-gradient(135deg,#8e44ad,#9b59b6);border-color:#be2edd}
.qb-room3{background:linear-gradient(135deg,#2980b9,#1f618d);border-color:#5dade2}
.qb-room4{background:linear-gradient(135deg,#27ae60,#2ecc71);border-color:#2ecc71}

/* 來電通知條 (漂移修復版) */
.incoming-call-banner{position:absolute;top:10px;left:8px;right:8px;background:linear-gradient(135deg,#2c3e50,#1a252f);border:2px solid #2ecc71;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 25px rgba(0,0,0,.85);z-index:90;pointer-events:auto;animation:bounceCall 1s infinite alternate}
@keyframes bounceCall{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
.incoming-call-banner .icon{width:40px;height:40px;border-radius:50%;background:#27ae60;display:flex;align-items:center;justify-content:center;font-size:20px}
.incoming-call-banner .meta{flex:1}
.incoming-call-banner .caller{color:#fff;font-weight:800;font-size:13px}
.incoming-call-banner .desc{color:#bdc3c7;font-size:10px;margin-top:2px}
.incoming-call-banner .btns{display:flex;gap:5px}
.incoming-call-banner button{padding:6px 10px;border-radius:16px;border:none;font-size:11px;font-weight:800;cursor:pointer}
.incoming-call-banner .ans-btn{background:#2ecc71;color:#fff}
.incoming-call-banner .rej-btn{background:#e74c3c;color:#fff}

/* 控制器 (D-PAD + 互動鍵) */
.ctrls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;align-items:flex-end;pointer-events:none}
.dpad{display:grid;grid-template-columns:40px 40px 40px;grid-template-rows:40px 40px 40px;gap:3px;pointer-events:auto}
.dpad button{width:40px;height:40px;background:rgba(36,24,16,.94);border:2px solid #845e3c;border-radius:9px;color:#f5eedc;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.dpad button:active,.dpad button.active{background:#b8860b;color:#1a1005;transform:scale(.92);border-color:#ffd700}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.dpad .mid{grid-column:2;grid-row:2;background:transparent;border:none;pointer-events:none}
.ctx{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd700,#b8860b);border:3px solid #fff5cc;box-shadow:0 4px 18px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-size:25px;color:#2a1a05;cursor:pointer;pointer-events:auto}
.ctx:active{transform:scale(.9)}
.touch-indicator{position:absolute;width:24px;height:24px;border:2px solid #ffd700;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0);transition:transform .3s,opacity .3s;opacity:0;z-index:25}

/* 對話與公告框 */
.dlg{position:absolute;bottom:88px;left:8px;right:8px;background:rgba(22,14,10,.98);border:2px solid #845e3c;border-radius:14px;padding:12px;display:none;z-index:40;max-height:52%;overflow-y:auto;pointer-events:auto;box-shadow:0 8px 25px rgba(0,0,0,.85)}
.dlg.show{display:block}
.dlg .who{font-size:13px;color:#70c0e8;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.dlg .who .av{width:24px;height:24px;border-radius:6px;background:#3a2a1a;display:flex;align-items:center;justify-content:center;font-size:13px}
.dlg .txt{font-size:13px;color:#f8f5ee;line-height:1.5;margin-bottom:8px}
.dlg .opts{display:flex;flex-direction:column;gap:6px}
.dlg .opt{background:rgba(44,30,20,.95);border:1.5px solid #845e3c;border-radius:8px;padding:8px 11px;font-size:12px;color:#f5eedc;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.dlg .opt:active{background:#b8860b;color:#111;border-color:#ffd700}
.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:rgba(28,18,12,.96);border:1.5px solid #b8860b;border-radius:10px;padding:7px 15px;font-size:12px;color:#ffd152;z-index:60;display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.7)}

#start{position:absolute;inset:0;background:linear-gradient(180deg,#24160e,#0e0805);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;pointer-events:auto}
#start h1{font-size:20px;color:#ffd152;text-align:center;margin-bottom:4px;text-shadow:0 2px 4px rgba(0,0,0,.8)}
#start .sub{font-size:12px;color:#c8b090;margin-bottom:14px;text-align:center}
#startGo{margin-top:14px;padding:11px 36px;background:linear-gradient(180deg,#ffd700,#b8860b);border:none;border-radius:22px;font-size:16px;font-weight:900;color:#2a1805;box-shadow:0 4px 14px rgba(0,0,0,.6);cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="360" height="640"></canvas>
<div class="touch-indicator" id="tInd"></div>

<!-- 即時來電橫幅 (已修復人物漂移) -->
<div class="incoming-call-banner" id="incomingBanner">
  <div class="icon">📞</div>
  <div class="meta">
    <div class="caller" id="incomingCaller">未知號碼來電</div>
    <div class="desc" id="incomingDesc">點擊接聽或掛斷</div>
  </div>
  <div class="btns">
    <button class="ans-btn" id="btnAnsCall">接聽 🟢</button>
    <button class="rej-btn" id="btnRejCall">掛斷 🔴</button>
  </div>
</div>

<div id="ui">
  <div class="hud">
    <div class="timebox" id="timeBox">
      <div class="day-tag" id="hudDay">週五 平日</div>
      <div class="tm" id="hudTime">08:00</div>
      <div class="lc" id="hudLoc">原木輔導室</div>
    </div>
    <div class="bars">
      <div class="brow en">⚡ <div class="trk"><div class="fil" id="barEn" style="width:85%"></div></div><span class="v" id="vEn">85</span></div>
      <div class="brow mo">💚 <div class="trk"><div class="fil" id="barMo" style="width:75%"></div></div><span class="v" id="vMo">75</span></div>
      <div class="brow wk">📄 <div class="trk"><div class="fil" id="barWk" style="width:25%"></div></div><span class="v" id="vWk">25</span></div>
      <div class="brow to" id="toRow">🚽 <div class="trk"><div class="fil" id="barTo" style="width:20%"></div></div><span class="v" id="vTo">20</span></div>
    </div>
  </div>

  <div class="task" id="taskBar">
    <div class="task-row">
      <span class="fg">🚩</span>
      <div>
        <div class="tt" id="taskTitle">探索校園與獨立教室</div>
        <div class="ts" id="taskSub">靠近物件或公告欄按 ✋</div>
      </div>
      <div class="task-pct" id="taskPct">25%</div>
    </div>
    <div class="runner-track">
      <div class="runner-fill" id="runnerFill" style="width:25%"></div>
      <div class="runner-person" id="runnerPerson" style="left:25%">🏃</div>
      <div class="runner-flag">🏁</div>
    </div>
  </div>

  <!-- 獨立房間快速切換傳送門 -->
  <div class="quick-tools">
    <div class="quick-btn qb-room1" onclick="switchRoom('counsel')">🛋️ 原木輔導室</div>
    <div class="quick-btn qb-room2" onclick="switchRoom('art')">🎨 美術教室</div>
    <div class="quick-btn qb-room3" onclick="switchRoom('music')">🎹 音樂教室</div>
    <div class="quick-btn qb-room4" onclick="switchRoom('sports')">🏟️ 室內運動場</div>
  </div>

  <div class="side">
    <div class="sb" onclick="triggerCallEvent()" title="測試來電">📞</div>
    <div class="sb" onclick="showBoardNotice()" title="公告欄">📋</div>
  </div>

  <div class="ctrls">
    <div class="dpad" id="dpad">
      <button class="u" data-d="up">▲</button><div class="mid"></div>
      <button class="l" data-d="left">◀</button>
      <button class="r" data-d="right">▶</button>
      <button class="d" data-d="down">▼</button>
    </div>
    <button class="ctx" id="ctxBtn">✋</button>
  </div>

  <div class="dlg" id="dlg">
    <div class="who" id="dlgWho"><span class="av" id="dlgAv">👤</span><span id="dlgName">系統</span></div>
    <div class="txt" id="dlgTxt"></div>
    <div class="opts" id="dlgOpts"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div id="start">
  <h1>校園生活大冒險<br>獨立房間與精緻美學版</h1>
  <div class="sub">4大精緻獨立房間・靠近公告欄彈窗・電話不漂移</div>
  <button id="startGo">進入校園</button>
</div>
</div>

<script>
// ============================================================
// 1. 遊戲核心狀態與 4 大獨立房間定義
// ============================================================
const W=360, H=640;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

let currentRoom = 'counsel'; // 'counsel' | 'art' | 'music' | 'sports'
let status={energy:85, mood:75, work:25, toilet:20, stars:20, coins:60, time:8*60};
let player={x:180, y:380, targetX:180, targetY:380, dir:0, frame:0, walk:0, speed:2.2, moving:false};
let pet={x:198, y:395, hop:0};
let keys={}, touchDir={up:0,down:0,left:0,right:0};
let dialogOpen=false, callActive=false, nearObj=null;
let boardNoticeCooldown=false;
let actx=null;

function initA(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)()}
function tone(f, d, type='sine', v=0.08){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+d);
}

function sfx(name){
  initA();
  if(!actx) return;
  if(name==='step') tone(75 + Math.random()*20, 0.05, 'triangle', 0.05);
  else if(name==='ok') [523, 659, 784].forEach((f, i)=>setTimeout(()=>tone(f, 0.12, 'sine', 0.06), i*60));
  else if(name==='ring') tone(440, 0.35, 'sine', 0.08);
  else if(name==='notice') [659, 880].forEach((f, i)=>setTimeout(()=>tone(f, 0.15, 'sine', 0.08), i*80));
}

// 換房間系統
function switchRoom(roomId){
  initA(); sfx('ok');
  currentRoom = roomId;
  // 切換房間時徹底停止移動並重置目標，防止任何飄移
  player.x = 180; player.y = 380;
  player.targetX = 180; player.targetY = 380;
  player.moving = false;

  const roomNames = {
    counsel: '原木輔導室',
    art: '美術美學教室',
    music: '音樂大鋼琴室',
    sports: '室內綜合運動場'
  };
  document.getElementById('hudLoc').textContent = roomNames[roomId];
  toast(`進入【${roomNames[roomId]}】`);
  updateHUD();
}

// ============================================================
// 2. 房間獨立場景繪製 (復刻參考圖 2.5D 精緻畫風)
// ============================================================
function drawPlant(x, y, isTall){
  ctx.save();
  ctx.fillStyle='rgba(15,8,5,0.45)';
  ctx.beginPath(); ctx.ellipse(x+8, y+16, isTall?12:9, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#9c4928'; ctx.fillRect(x+2, y+6, 12, 10);
  ctx.fillStyle='#b85c35'; ctx.fillRect(x+1, y+4, 14, 3);
  if(isTall){
    ctx.fillStyle='#5c341b'; ctx.fillRect(x+7, y-12, 3, 18);
    ctx.fillStyle='#1d632f'; ctx.beginPath(); ctx.arc(x+8, y-16, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#2e8b42'; ctx.beginPath(); ctx.arc(x+6, y-19, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#52c468'; ctx.beginPath(); ctx.arc(x+9, y-21, 7, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#1d632f'; ctx.fillRect(x-2, y-2, 20, 8);
    ctx.fillStyle='#2e8b42'; ctx.fillRect(x, y-5, 16, 8);
    ctx.fillStyle='#52c468'; ctx.fillRect(x+3, y-7, 10, 6);
  }
  ctx.restore();
}

function renderCurrentRoom(){
  const drawList = [];

  if(currentRoom === 'counsel'){
    // --- 1. 原木輔導室 (復刻參考圖) ---
    ctx.fillStyle='#362013'; ctx.fillRect(0,0,W,H);
    for(let x=-H; x<W+H; x+=24){
      ctx.strokeStyle='rgba(26,14,8,0.45)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H*0.6, H); ctx.stroke();
    }
    // 左牆護牆板與公告欄
    ctx.fillStyle='#4c2d18'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(190,0); ctx.lineTo(0,180); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8c5e38'; ctx.fillRect(14, 30, 28, 38);
    ctx.fillStyle='#fdfaf2'; ctx.fillRect(16, 32, 24, 34); // 公告欄
    ctx.fillStyle='#c84b31'; ctx.fillRect(18, 36, 8, 8);

    // 右側落地窗金黃陽光
    const wx=250, wy=35, ww=95, wh=185;
    ctx.fillStyle='#ffe8b0'; ctx.fillRect(wx, wy, ww, wh);
    ctx.fillStyle='#fff6d8'; ctx.fillRect(wx+3, wy+3, ww-6, wh-6);
    ctx.fillStyle='#61381c'; ctx.fillRect(wx, wy, ww, 4); ctx.fillRect(wx, wy+wh-4, ww, 4); ctx.fillRect(wx, wy, 4, wh); ctx.fillRect(wx+ww-4, wy, 4, wh);

    // 地毯
    ctx.fillStyle='#2d5a49'; ctx.fillRect(70, 280, 155, 95);
    ctx.fillStyle='#3c725d'; ctx.fillRect(74, 284, 147, 87);
    ctx.strokeStyle='#d4b068'; ctx.lineWidth=1.5; ctx.strokeRect(80, 290, 135, 75);

    // 家具深度排序
    drawList.push({
      y: 110,
      draw: ()=>{
        ctx.fillStyle='#4c2a16'; ctx.fillRect(105, 30, 80, 82);
        ctx.fillStyle='#61381c'; ctx.fillRect(107, 32, 76, 78);
        drawPlant(115, 24, false); drawPlant(155, 24, false);
      }
    });
    drawList.push({
      y: 135,
      draw: ()=>{
        ctx.fillStyle='#e8ecef'; ctx.fillRect(188, 92, 18, 42); // 飲水機
        ctx.fillStyle='#2980b9'; ctx.fillRect(191, 76, 12, 16);
        drawPlant(212, 128, true);
      }
    });
    drawList.push({
      y: 180,
      draw: ()=>{
        ctx.fillStyle='#5a341b'; ctx.fillRect(36, 126, 72, 42); // 辦公桌
        ctx.fillStyle='#2c3e50'; ctx.fillRect(80, 118, 22, 18);
        ctx.fillStyle='#3498db'; ctx.fillRect(82, 120, 18, 14);
      }
    });
    drawList.push({
      y: 240,
      draw: ()=>{
        ctx.fillStyle='#855a3c'; ctx.fillRect(230, 200, 80, 36); // 靠窗長沙發
        ctx.fillStyle='#d8be9b'; ctx.fillRect(232, 202, 76, 32);
        drawPlant(314, 215, true);
      }
    });
    drawList.push({
      y: 335,
      draw: ()=>{
        ctx.fillStyle='#6b4224'; ctx.fillRect(115, 318, 46, 18); // 茶几
        ctx.fillStyle='#8c5832'; ctx.fillRect(117, 319, 42, 14);
      }
    });
  } else if(currentRoom === 'art'){
    // --- 2. 美術教室 ---
    ctx.fillStyle='#4a4238'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#6b6154'; ctx.fillRect(20, 40, 320, 560); // 畫室木地板
    // 牆面色彩色相環
    ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(60, 80, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#3498db'; ctx.beginPath(); ctx.arc(100, 80, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(140, 80, 18, 0, Math.PI*2); ctx.fill();
    
    drawList.push({
      y: 220,
      draw: ()=>{
        ctx.fillStyle='#8e5830'; ctx.fillRect(70, 160, 8, 60); // 畫架
        ctx.fillStyle='#fff'; ctx.fillRect(50, 170, 48, 36);
        ctx.fillStyle='#e74c3c'; ctx.fillRect(56, 176, 12, 12);
        ctx.fillStyle='#3498db'; ctx.fillRect(72, 182, 14, 10);
      }
    });
    drawList.push({
      y: 260,
      draw: ()=>{
        ctx.fillStyle='#5c381e'; ctx.fillRect(170, 200, 120, 50); // 調色長桌
        ctx.fillStyle='#ecf0f1'; ctx.fillRect(180, 210, 24, 16);
      }
    });
  } else if(currentRoom === 'music'){
    // --- 3. 音樂教室 ---
    ctx.fillStyle='#2c3e50'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#34495e'; ctx.fillRect(20, 40, 320, 560);
    // 五線譜牆面
    ctx.strokeStyle='#7f8c8d'; ctx.lineWidth=1;
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(40, 60+i*8); ctx.lineTo(320, 60+i*8); ctx.stroke(); }
    
    drawList.push({
      y: 240,
      draw: ()=>{
        ctx.fillStyle='#111'; ctx.fillRect(120, 180, 120, 60); // 三角大鋼琴
        ctx.fillStyle='#fff'; ctx.fillRect(130, 225, 100, 12);
        ctx.fillStyle='#000';
        for(let k=134; k<226; k+=8) ctx.fillRect(k, 225, 4, 8);
      }
    });
  } else if(currentRoom === 'sports'){
    // --- 4. 室內運動場 ---
    ctx.fillStyle='#85522c'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#d39e5e'; ctx.fillRect(20, 40, 320, 560); // 楓木運動地板
    // 球場白線
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.strokeRect(40, 80, 280, 480);
    ctx.beginPath(); ctx.moveTo(40, 320); ctx.lineTo(320, 320); ctx.stroke();

    drawList.push({
      y: 200,
      draw: ()=>{
        ctx.fillStyle='#e74c3c'; ctx.fillRect(150, 150, 60, 40); // 射箭靶位
        ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(180, 170, 12, 0, Math.PI*2); ctx.fill();
      }
    });
    drawList.push({
      y: 320,
      draw: ()=>{
        ctx.fillStyle='#ecf0f1'; ctx.fillRect(38, 318, 284, 4); // 排球中網
      }
    });
  }

  // 玩家與白兔加入深度排序清單
  drawList.push({
    y: player.y,
    draw: ()=>{
      drawChar(player.x, player.y, player.frame, true);
    }
  });

  // Y-Sorting 深度繪製
  drawList.sort((a,b)=>a.y - b.y);
  drawList.forEach(item => item.draw());
}

function drawChar(x, y, frame, isPlayer){
  const px=Math.floor(x), py=Math.floor(y);
  // 角色本體
  ctx.fillStyle='#ffffff';
  ctx.fillRect(px-5, py+16, 4, 6); ctx.fillRect(px+1, py+16, 4, 6);
  ctx.fillStyle='#2b1a10';
  ctx.fillRect(px-6, py+21, 5, 4); ctx.fillRect(px+1, py+21, 5, 4);
  ctx.fillStyle='#273c75'; ctx.fillRect(px-7, py+11, 14, 6);
  ctx.fillStyle='#f5f6fa'; ctx.fillRect(px-6, py+3, 12, 9);
  ctx.fillStyle='#ffd8b3'; ctx.fillRect(px-6, py-8, 12, 12);
  ctx.fillStyle='#9e5d32'; ctx.fillRect(px-8, py-12, 16, 6);
  
  // 白兔寵物
  if(isPlayer){
    pet.x += (player.x + 18 - pet.x) * 0.15;
    pet.y += (player.y + 4 - pet.y) * 0.15;
    const petX=Math.floor(pet.x), petY=Math.floor(pet.y);
    ctx.fillStyle='#ffffff';
    ctx.fillRect(petX, petY+2, 9, 8);
    ctx.fillRect(petX+6, petY-2, 6, 6);
  }
}

// ============================================================
// 3. 遊戲更新循環與飄移防止機制
// ============================================================
function update(dt){
  // 當來電橫幅跳出或對話框開啟時，完全凍結座標移動，修復飄移 Bug
  if(callActive || dialogOpen){
    player.targetX = player.x;
    player.targetY = player.y;
    player.moving = false;
    return;
  }

  let mx=0, my=0;
  if(keys['ArrowUp'] || keys['w'] || touchDir.up) my=-1;
  if(keys['ArrowDown'] || keys['s'] || touchDir.down) my=1;
  if(keys['ArrowLeft'] || keys['a'] || touchDir.left) mx=-1;
  if(keys['ArrowRight'] || keys['d'] || touchDir.right) mx=1;

  if(player.targetX!==player.x || player.targetY!==player.y){
    const dx=player.targetX - player.x, dy=player.targetY - player.y;
    const dist=Math.hypot(dx, dy);
    if(dist > 5){
      mx = dx / dist; my = dy / dist;
    } else {
      player.targetX = player.x; player.targetY = player.y;
    }
  }

  if(mx!==0 || my!==0){
    player.moving=true;
    player.x += mx * player.speed;
    player.y += my * player.speed;
    player.x = Math.max(35, Math.min(325, player.x));
    player.y = Math.max(130, Math.min(560, player.y));
    player.walk += 0.16;
    player.frame = Math.floor(player.walk) % 2;
    if(Math.random()<0.08) sfx('step');
  } else {
    player.moving=false;
  }

  // 靠近公告欄自動跳出公告事件檢測
  checkProximityToBoard();
  updateHUD();
}

// 靠近公告欄即彈出公告事項
function checkProximityToBoard(){
  if(currentRoom === 'counsel'){
    const distToBoard = Math.hypot(player.x - 28, player.y - 48);
    if(distToBoard < 45 && !boardNoticeCooldown && !dialogOpen){
      boardNoticeCooldown = true;
      sfx('notice');
      showBoardNotice();
      setTimeout(()=>{ boardNoticeCooldown = false; }, 8000);
    }
  }
}

function showBoardNotice(){
  const notices = [
    '【今日校園公告】<br>狂賀！本校榮獲全市美感教育特優獎！下午 14:00 請各班班代至美術教室領取觀展手冊。',
    '【資安與防詐宣導】<br>提醒全校同學：凡接獲簡訊要求提供「驗證碼」或「補繳包裹運費」者，一律為詐騙，請立刻向輔導室或 165 專線查證！',
    '【體育週特別活動】<br>室內運動場今日開放排球扣殺與射箭體驗，歡迎同學們放學後組隊參加！',
    '【心靈小補帖】<br>感到疲憊時，記得深呼吸。自律不是束縛，而是掌控人生的自信起點。'
  ];
  const msg = notices[Math.floor(Math.random()*notices.length)];
  showDlg('📋 校園公佈欄即時公告', msg, [
    {t:'收到，我會遵守並提醒同學！', a:()=>{ status.stars+=3; toast('閱讀校園公告 +3⭐'); updateHUD(); }}
  ]);
}

// 測試來電觸發 (展示修復後的無飄移接聽機制)
function triggerCallEvent(){
  callActive = true;
  // 鎖定人物
  player.targetX = player.x; player.targetY = player.y; player.moving = false;
  sfx('ring');
  const banner = document.getElementById('incomingBanner');
  banner.style.display = 'flex';
  document.getElementById('incomingCaller').textContent = '媽媽 ❤️ 來電中';
  document.getElementById('incomingDesc').textContent = '外面降溫了，提醒你加件外套！';
}

document.getElementById('btnAnsCall').onclick = ()=>{
  document.getElementById('incomingBanner').style.display = 'none';
  callActive = false;
  sfx('ok');
  showDlg('媽媽 ❤️', '「寶貝～外面天氣變涼了，出門有沒有記得多帶一件外套？午餐有沒有吃飽飽呀？」', [
    {t:'「有喔媽媽！我有吃飽穿暖，您也要照顧好身體！」', a:()=>{ status.mood=Math.min(100, status.mood+12); toast('親情好感提升！+12💖'); updateHUD(); }}
  ]);
};

document.getElementById('btnRejCall').onclick = ()=>{
  document.getElementById('incomingBanner').style.display = 'none';
  callActive = false;
  toast('已掛斷電話');
};

function updateHUD(){
  const h=Math.floor(status.time/60), m=Math.floor(status.time%60);
  document.getElementById('hudTime').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  document.getElementById('barEn').style.width=status.energy+'%'; document.getElementById('vEn').textContent=Math.round(status.energy);
  document.getElementById('barMo').style.width=status.mood+'%'; document.getElementById('vMo').textContent=Math.round(status.mood);
  document.getElementById('barWk').style.width=status.work+'%'; document.getElementById('vWk').textContent=Math.round(status.work);
  document.getElementById('barTo').style.width=status.toilet+'%'; document.getElementById('vTo').textContent=Math.round(status.toilet);
}

// ============================================================
// 4. 輸入監聽與初始化
// ============================================================
cv.addEventListener('pointerdown', e=>{
  if(dialogOpen || callActive) return;
  const rect=cv.getBoundingClientRect();
  const scaleX=W / rect.width, scaleY=H / rect.height;
  player.targetX = (e.clientX - rect.left) * scaleX;
  player.targetY = (e.clientY - rect.top) * scaleY;
  const ind=document.getElementById('tInd');
  ind.style.left=(e.clientX - rect.left)+'px'; ind.style.top=(e.clientY - rect.top)+'px';
  ind.style.opacity='1'; ind.style.transform='translate(-50%,-50%) scale(1.4)';
  setTimeout(()=>{ ind.style.opacity='0'; ind.style.transform='translate(-50%,-50%) scale(0)'; }, 300);
});

document.querySelectorAll('#dpad button').forEach(btn=>{
  const d=btn.dataset.d; if(!d) return;
  const press=e=>{ e.preventDefault(); initA(); touchDir[d]=1; btn.classList.add('active'); player.targetX=player.x; player.targetY=player.y; };
  const release=e=>{ e.preventDefault(); touchDir[d]=0; btn.classList.remove('active'); };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
});

window.addEventListener('keydown', e=>{
  keys[e.key]=true; player.targetX=player.x; player.targetY=player.y;
});
window.addEventListener('keyup', e=>keys[e.key]=false);

function showDlg(who, txt, opts){
  dialogOpen=true;
  document.getElementById('dlg').classList.add('show');
  document.getElementById('dlgName').textContent=who;
  document.getElementById('dlgTxt').innerHTML=txt;
  const box=document.getElementById('dlgOpts'); box.innerHTML='';
  (opts||[]).forEach((o, i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span>${String.fromCharCode(65+i)}. ${o.t}</span>`;
    b.onclick=()=>{ sfx('click'); closeDlg(); if(o.a) o.a(); };
    box.appendChild(b);
  });
  if(!opts||!opts.length){
    const b=document.createElement('button');
    b.className='opt'; b.textContent='知道了'; b.onclick=closeDlg; box.appendChild(b);
  }
}
function closeDlg(){ dialogOpen=false; document.getElementById('dlg').classList.remove('show'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2200); }

document.getElementById('startGo').onclick=()=>{
  document.getElementById('start').style.display='none';
  initA(); sfx('ok');
  toast('早安！點擊地面開始自由探索校園！');
};

let lastTime=performance.now();
function gameLoop(now){
  const dt=now-lastTime; lastTime=now;
  update(dt);
  renderCurrentRoom();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
